  air: [
    ["What type of network dominates modern medical image analysis?","The convolutional neural network",["A straightforward linear regression model fitted to the pixels","A rule-based expert system","A single decision tree"],"Convolutional layers detect spatial features in images."],
    ["What does 'supervised learning' require?","Labelled training examples",["No labelled data at all, relying only on hand-written rules","Only unlabelled raw images","A single example per class"],"Each image is paired with a known ground-truth label."],
    ["What is 'ground truth' in a radiology AI dataset?","The reference-standard correct label",["The model's own most uncertain and low-confidence prediction","The raw pixel data alone","The scanner manufacturer's setting"],"It is often set by expert consensus or biopsy."],
    ["What does model 'overfitting' describe?","Learning noise, failing to generalise",["Performing poorly on the training data itself","Using too little training data always","Ignoring the labels entirely"],"It performs well on training but poorly on new cases."],
    ["What is a validation set used for?","Tuning the model during development",["Reporting the final headline accuracy","Training the model's weights directly","Storing the raw scanner output"],"A separate test set gives the unbiased final estimate."],
    ["Why is an external test set important?","It checks generalisation to new sites",["It speeds up the training process and reduces the compute needed","It removes the need for any labels","It increases the training data size"],"Performance often drops on data from other hospitals."],
    ["What does 'sensitivity' measure for an AI tool?","The proportion of true cases detected",["The proportion of healthy cases called normal","The overall speed of the algorithm","The size of the training dataset"],"It is also called the true positive rate or recall."],
    ["What does 'specificity' measure?","The proportion of normals correctly cleared",["The proportion of genuinely diseased cases that are detected","The total number of images processed","The confidence of a single output"],"High specificity means few false positives."],
    ["What does the area under the ROC curve summarise?","Overall discrimination across thresholds",["The single accuracy value measured at one fixed threshold only","The training time of the model","The number of layers in the network"],"An AUC of 1.0 is perfect and 0.5 is chance."],
    ["What is a false positive in a screening AI?","A normal case flagged as abnormal",["A true cancer that is missed entirely","A correctly cleared normal study","A scan that fails to process"],"Too many increase recall rates and patient anxiety."],
    ["What is 'automation bias'?","Over-trusting the AI's output",["Refusing to ever use any AI tool","A hardware fault in the scanner","A type of image reconstruction"],"A radiologist may miss errors by deferring to the model."],
    ["What is a key risk of 'dataset shift'?","Performance drops when data distribution changes",["The model gradually runs more slowly the longer it is used","Labels become permanently unusable","The scanner physically degrades"],"A new scanner or protocol can silently degrade accuracy."],
    ["What does 'explainability' aim to provide?","Insight into why a model decided",["Considerably faster training of the underlying neural network","More labelled training data","A higher raw accuracy score"],"Saliency maps highlight influential image regions."],
    ["What is a saliency or heat map used for?","Showing regions influencing a prediction",["Reconstructing the raw k-space data acquired by the scanner","Measuring the radiation dose given","Labelling the training dataset"],"It helps a reader sanity-check the model's focus."],
    ["What regulatory concept covers AI that updates itself?","A locked versus adaptive algorithm",["A purely open-source software licence with no clinical oversight","A single fixed hardware standard","A manual reporting template"],"Regulators scrutinise continuously learning models closely."],
    ["Why must training data be demographically representative?","To avoid bias against under-represented groups",["To make the whole model train very much faster on the hardware","To reduce the total storage needed","To remove the need for validation"],"Skin tone, age and sex imbalance can skew performance."],
    ["What is 'data leakage' in model development?","Test information contaminating training",["The accidental loss of patient data from an insecure server","Slow transfer of images over a network","A drop in the scanner signal"],"It gives falsely high, unreproducible performance."],
    ["What does 'segmentation' mean in imaging AI?","Outlining a structure pixel by pixel",["Classifying a whole image with one label","Ordering scans by acquisition time","Compressing the image for storage"],"It is used for volumes, such as tumour size."],
    ["What is 'classification' in imaging AI?","Assigning a whole image to a category",["Outlining every organ boundary precisely","Predicting the next word in a report","Reconstructing the raw signal"],"An example is normal versus abnormal chest radiograph."],
    ["What role can AI play in image reconstruction?","Denoising to allow lower-dose scanning",["Increasing the patient's radiation dose","Replacing the scanner hardware entirely","Removing the need for any contrast"],"Deep-learning reconstruction can cut CT dose or MRI time."],
    ["What is a 'foundation model'?","A large model pre-trained on broad data",["A single-task model trained from scratch","A rule-based diagnostic checklist","A hardware component of the scanner"],"It can be fine-tuned for many downstream tasks."],
    ["What does 'fine-tuning' a model mean?","Adapting a pre-trained model to a new task",["Training a completely fresh model from scratch with no prior data","Manually adjusting the scanner settings","Relabelling the entire test dataset"],"It needs far less data than training from scratch."],
    ["Why is prospective clinical validation important?","It tests the tool in real workflow",["It is faster than any other evaluation","It removes the need for regulation","It guarantees a perfect accuracy score"],"Retrospective results often overstate real-world value."],
    ["What is the main medico-legal question with AI errors?","Who is accountable for a missed finding",["Which particular programming language the tool was written in","How fast the algorithm ran","The colour of the output display"],"Responsibility usually remains with the supervising clinician."],
    ["What is a 'black box' concern in AI?","Decisions that cannot be readily explained",["A model whose reasoning is fully transparent and easily audited","A scanner with no display screen","An error in the electrical wiring"],"Opacity complicates trust and error analysis."],
    ["What does 'triage' AI in radiology do?","Prioritises urgent studies on the worklist",["It writes the entire final radiology report without any human input","Sets the scanner acquisition parameters","Bills the patient automatically"],"Flagging a suspected bleed can speed treatment."],
    ["What is 'computer-aided detection' (CADe)?","Marking suspicious regions for a reader",["Fully autonomous diagnosis without a doctor","A method of image compression","A scanner calibration routine"],"It has long been used in mammography screening."],
    ["What distinguishes CADx from CADe?","CADx characterises, CADe only detects",["CADe diagnoses the disease while CADx merely marks a suspicious spot","They are identical in every respect","CADx sets the radiation dose"],"CADx offers a likelihood of malignancy, for instance."],
    ["What is 'confidence calibration' in a model?","Predicted probabilities matching real rates",["The overall speed at which the model produces its final output","The resolution of the input image","The size of the training set"],"A poorly calibrated model is over- or under-confident."],
    ["Why can accuracy alone be misleading in rare disease?","A model can score high by always saying normal",["Because accuracy is always exactly equal to the sensitivity value","It ignores the training time entirely","It only applies to segmentation"],"Class imbalance demands sensitivity and specificity too."],
    ["What is 'federated learning'?","Training across sites without sharing raw data",["Uploading all of the patient scans to one central shared server","Using only a single hospital's data","A method of scanner maintenance"],"Only model updates, not images, leave each institution."],
    ["What is an 'adversarial example'?","An input subtly altered to fool a model",["A perfectly and carefully labelled case within the training data","A normal scan with no pathology","A duplicate image in the dataset"],"Tiny perturbations can flip a confident prediction."],
    ["What does DICOM standardise?","Storage and exchange of medical images",["The internal architecture of the deep neural network being used","The dose limits for CT scanning","The wording of radiology reports"],"AI tools must integrate with DICOM and the PACS."],
    ["What is a key barrier to clinical AI deployment?","Integration into existing workflow and PACS",["A complete and total lack of any available imaging data at all","The impossibility of labelling images","An absence of any regulatory pathway"],"A tool must fit smoothly into the reporting process."],
    ["What does 'natural language processing' enable in radiology?","Mining information from free-text reports",["Reconstructing diagnostic images directly from the raw scanner signal","Segmenting organs on a CT scan","Calibrating the MRI magnet"],"It can label large datasets or flag critical results."],
    ["What is a large language model's main risk in reporting?","Producing fluent but fabricated content",["Running far too slowly on the hardware to be clinically useful","Refusing to generate any text at all","Requiring no data to be trained"],"Such 'hallucinations' must be checked by a clinician."],
    ["What does model 'generalisability' mean?","Working well on data beyond the training set",["Performing well only on the exact data it was trained upon","Running on one specific scanner only","Detecting a single disease only"],"It is the central challenge for clinical AI."],
    ["Why is continuous post-deployment monitoring needed?","Performance can drift as practice changes",["Deployed models never change and so cannot ever drift over time","It replaces the need for validation","It is required only for research"],"Scanner upgrades and case mix can degrade accuracy."],
    ["What is the purpose of a 'human-in-the-loop' design?","Keeping a clinician overseeing AI output",["Removing the radiologist from the process entirely to save time","Speeding training with more data","Raising the model's raw accuracy"],"It preserves accountability and catches errors."],
    ["What ethical issue arises from AI trained on biased data?","It may worsen existing health inequities",["It always improves care for everyone equally","It removes all diagnostic error","It has no effect on any patient group"],"Bias can be amplified rather than corrected."],
    ["What is the realistic near-term role of AI in radiology?","Assisting and augmenting, not replacing, readers",["Fully replacing every radiologist in the department all at once","Eliminating the need for any imaging","Setting hospital staffing levels"],"Most tools support triage, detection and quantification."]

  occ: [
    ["What is the primary aim of occupational medicine?","Protecting health in relation to work",["Treating every acute illness that a worker develops","Certifying that a workplace is entirely risk-free","Recruiting new staff for an employer"],"It covers both the effect of work on health and of health on work."],
    ["What does the hierarchy of controls rank first?","Elimination of the hazard",["Providing workers with personal protective equipment","Written safe systems of work and training","Health surveillance of exposed staff"],"PPE sits at the very bottom, as a last resort."],
    ["Where does personal protective equipment sit in the hierarchy?","Last, as the least reliable control",["First, as the most effective single measure","Above engineering controls in reliability","Equal with elimination of the hazard"],"It only protects the wearer and depends on correct use."],
    ["What lung disease is caused by inhaling coal dust?","Coal workers' pneumoconiosis",["Extrinsic allergic alveolitis from mouldy hay","Mesothelioma of the pleural lining","Occupational asthma from isocyanates"],"Progressive massive fibrosis is its most severe form."],
    ["Which mineral fibre causes mesothelioma?","Asbestos",["Crystalline silica from cutting stone","Cotton dust in textile mills","Wood dust from hardwoods"],"Even brief, low-level exposure can cause it decades later."],
    ["What is the typical latency of mesothelioma after exposure?","Around 30 to 40 years",["A few weeks after the first heavy exposure","About 2 to 3 years at most","Roughly 5 years on average"],"This long latency complicates attributing it to a specific job."],
    ["Which occupational lung disease results from silica dust?","Silicosis",["Byssinosis from raw cotton processing","Bagassosis from mouldy sugar cane","Farmer's lung from hay"],"Stonemasons and sandblasters are classically at risk."],
    ["What is byssinosis caused by?","Cotton, flax or hemp dust",["Beryllium fumes in the aerospace industry","Grain dust in agricultural stores","Diisocyanates in spray painting"],"Symptoms are classically worst on the first day back at work."],
    ["Which agent most commonly causes occupational asthma?","Isocyanates",["Ordinary house dust mite allergen","Tobacco smoke in a shared office","Diesel exhaust in a car park"],"They are used in spray paints and polyurethane foams."],
    ["What pattern suggests occupational asthma?","Symptoms improving away from work",["Symptoms that are completely constant day and night","Wheeze only during weekend leisure activity","Breathlessness confined to holidays abroad"],"Serial peak flow readings on and off work help confirm it."],
    ["What is hand-arm vibration syndrome linked to?","Prolonged use of vibrating tools",["Repetitive lifting of very heavy boxes","Long periods of computer keyboard work","Exposure to loud industrial noise"],"Vibration white finger is one of its features."],
    ["What is the earliest reliable sign of noise-induced hearing loss?","A notch around 4 kilohertz on audiometry",["Complete and permanent deafness in one ear from the outset","Loss of only very low frequency sounds","Ringing that resolves within an hour"],"The dip at 4 kHz is characteristic before speech is affected."],
    ["How is noise-induced hearing loss best prevented?","Reducing noise at source and hearing protection",["Annual protective injections offered to all exposed workers","Rotating staff through a single quiet break","Oral steroids given after each exposure"],"Engineering controls come before ear defenders in the hierarchy."],
    ["What does a 'fitness for work' assessment decide?","Whether health affects safe job performance",["Whether a worker deserves a pay increase","The general medical diagnosis of an illness","Whether to dismiss an underperforming employee"],"It focuses on function and adjustments, not diagnosis alone."],
    ["What is a reasonable adjustment under equality law?","A change enabling a disabled person to work",["A pay rise given to compensate for illness","Automatic early retirement on health grounds","A reduction in the worker's legal rights"],"Examples include altered hours, equipment or duties."],
    ["What underpins a valid pre-placement health assessment?","Assessing fitness for the specific role",["Screening out anyone with any past illness","Predicting future sickness absence exactly","Setting insurance premiums for the firm"],"It should be job-related and follow a conditional offer."],
    ["What is health surveillance for?","Detecting early work-related ill health",["Diagnosing unrelated conditions in staff","Deciding annual bonuses for a team","Replacing the need for any hazard control"],"It is required where a valid technique can detect early harm."],
    ["What is a biological exposure index used for?","Comparing a biomarker with a reference value",["Setting the airborne concentration limit alone","Ranking employees by their fitness level","Measuring the noise dose in a shift"],"Blood lead is a classic example of biological monitoring."],
    ["What does blood lead monitoring detect?","Absorbed dose of lead in the body",["Airborne lead concentration in the workshop","Lead contamination on work surfaces","The risk of an explosion from lead dust"],"It reflects internal dose better than air sampling alone."],
    ["Which cancer is linked to occupational bladder exposure?","Bladder cancer from aromatic amines",["Skin cancer from working night shifts","Leukaemia from loud industrial noise","Lung cancer from repetitive lifting"],"Dye and rubber industry workers were historically affected."],
    ["Which solvent exposure is linked to leukaemia?","Benzene",["Toluene used in some adhesives","White spirit in decorating","Acetone in nail products"],"It affects the bone marrow after prolonged exposure."],
    ["What is the main hazard of night-shift work?","Circadian disruption and its health effects",["An immediate and completely permanent loss of hearing acuity","Rapid onset of occupational asthma","Direct damage to the retina"],"It is linked to metabolic, cardiovascular and possibly cancer risk."],
    ["What is a key musculoskeletal risk in manual handling?","Awkward postures and repetitive lifting",["Exposure to loud noise on the shop floor","Inhaling fine crystalline silica dust","Contact with sensitising chemicals"],"A risk assessment considers task, load, environment and individual."],
    ["What does a display screen equipment assessment address?","Workstation ergonomics and eye strain",["The overall fire safety of the entire office building","The chemical storage arrangements","The noise level in the office"],"Regular breaks and adjustable seating are typical outcomes."],
    ["What is occupational contact dermatitis usually caused by?","Irritants or allergens on the skin",["A virus spread between colleagues at work","Prolonged staring at a computer screen","Lifting heavy objects repeatedly"],"Wet work and latex are common culprits in healthcare."],
    ["What is latex allergy an example of in the workplace?","An occupational type I hypersensitivity",["A purely irritant reaction with no immune basis","A musculoskeletal injury from gloves","A noise-induced condition"],"Powder-free, low-protein or nitrile gloves reduce the risk."],
    ["Which vaccine is offered to at-risk healthcare workers?","Hepatitis B",["Yellow fever for all indoor office staff","Rabies for every hospital cleaner","Typhoid for routine ward duties"],"It protects against blood-borne exposure via needlestick."],
    ["What is the first step after a needlestick injury?","Encourage bleeding and wash the wound",["Immediately start a full course of antibiotics","Wait a week before reporting the incident","Apply a tight tourniquet above the site"],"Risk assessment and possible post-exposure prophylaxis follow."],
    ["What does post-exposure prophylaxis aim to prevent?","Infection after a blood-borne exposure",["A future musculoskeletal injury to the lower back","Occupational asthma developing later","Noise-induced hearing loss"],"It is most relevant to HIV after a high-risk exposure."],
    ["What is the purpose of a COSHH assessment?","Controlling exposure to hazardous substances",["Assessing an employee's overall fitness to work","Setting the level of the company pension","Measuring workplace noise exposure only"],"COSHH covers chemicals, dusts, fumes and some biological agents."],
    ["What is a workplace exposure limit?","A maximum airborne concentration over time",["The total number of hours that a single shift may last","A minimum wage for hazardous work","The maximum noise dose per week"],"It is usually expressed as an 8-hour time-weighted average."],
    ["What is 'presenteeism' in occupational health?","Attending work while too unwell to be effective",["Deliberately taking far more sick leave than is warranted","Arriving late most mornings","Refusing all adjustments"],"It can prolong illness and reduce productivity."],
    ["What does an ill-health retirement assessment consider?","Permanent incapacity for the role until pension age",["Whether the worker has simply grown to dislike the job","The employer's short-term staffing needs","The worker's years of service only"],"The threshold is usually permanence, judged on medical evidence."],
    ["Which condition is classically linked to working with mouldy hay?","Farmer's lung",["Silicosis from cutting sandstone blocks","Mesothelioma from asbestos lagging","Bladder cancer from aniline dyes"],"It is a form of extrinsic allergic alveolitis."],
    ["What causes decompression sickness in divers?","Nitrogen bubbles forming on rapid ascent",["An excess of oxygen slowly dissolving into the body tissues","Carbon dioxide building up in the lungs","Cold water lowering the core temperature"],"Slow, staged ascent and recompression treatment are key."],
    ["What is a hazard, as distinct from a risk?","Something with the potential to cause harm",["The likelihood that harm will actually occur","The financial cost of an injury claim","A control measure put in place already"],"Risk combines the likelihood and severity of that harm."],
    ["What is the sensitiser 'colophony' associated with?","Solder fume in electronics work",["Grain dust in agricultural stores","Wet cement on building sites","Diesel exhaust in depots"],"It can cause occupational asthma in soldering."],
    ["What is the main risk from chronic beryllium exposure?","Chronic beryllium disease of the lungs",["Immediate and reversible skin irritation","Noise-induced hearing loss over time","A musculoskeletal shoulder injury"],"It is a granulomatous disease resembling sarcoidosis."],
    ["What does 'work-relatedness' assessment weigh?","Whether the job materially contributed to illness",["Whether the worker is generally in good health overall","The size and profits of the employer","The worker's lifestyle choices only"],"It considers exposure, timing, mechanism and other causes."],
    ["Which shift-work control best reduces fatigue risk?","Well-designed rosters with adequate rest",["Longer shifts to reduce the number of handovers","Removing all rest breaks to finish sooner","Rotating shifts backwards against the clock"],"Forward-rotating patterns are generally better tolerated."],
    ["What is the main ethical duty of an occupational physician?","Impartiality between worker and employer",["Acting solely in the employer's commercial interest","Disclosing all clinical details to management","Always recommending dismissal on health grounds"],"Confidentiality of clinical information is central to the role."]

  ana: [
    ["Which ASA grade describes a normal healthy patient?","ASA I",["ASA II","ASA III","ASA IV"],"ASA II is mild systemic disease."],
    ["The Mallampati score assesses what?","Oropharyngeal view predicting difficult intubation",["Cardiac risk before major non-cardiac surgery in adults","Renal function","Bleeding risk"],"Class IV sees only the hard palate."],
    ["What is the classic triad of general anaesthesia?","Hypnosis, analgesia and muscle relaxation",["Induction, then maintenance, then emergence","Airway, breathing and circulation","Sedation, hydration and warming"],"Sometimes called the anaesthetic triad."],
    ["Which depolarising neuromuscular blocker is used in rapid sequence induction?","Suxamethonium",["Rocuronium bromide","Atracurium","Vecuronium"],"Rapid onset and short duration."],
    ["Which agent reverses rocuronium directly by encapsulation?","Sugammadex",["Neostigmine","Atropine","Naloxone"],"A modified gamma-cyclodextrin."],
    ["Which drug is the definitive treatment for malignant hyperthermia?","Dantrolene",["Intravenous adrenaline","Propofol","Atropine"],"It inhibits ryanodine receptor calcium release."],
    ["Which agents classically trigger malignant hyperthermia?","Volatile anaesthetics and suxamethonium",["Propofol, midazolam and ketamine together","Ketamine and fentanyl","Nitrous oxide alone"],"A pharmacogenetic disorder of skeletal muscle."],
    ["What is the treatment for severe local anaesthetic systemic toxicity?","Intravenous lipid emulsion",["Dantrolene and then flumazenil","Flumazenil","Naloxone"],"Also called Intralipid rescue."],
    ["Which local anaesthetic is most cardiotoxic?","Bupivacaine",["Lidocaine","Prilocaine","Chloroprocaine"],"Its cardiac toxicity is difficult to reverse."],
    ["What does MAC stand for in inhalational anaesthesia?","Minimum alveolar concentration",["Maximum anaesthetic concentration","Mean arterial concentration","Minimum airway compliance"],"The concentration preventing movement in 50% of patients."],
    ["Which monitoring is mandatory to confirm tracheal intubation?","Waveform capnography",["Pulse oximetry on its own","Blood pressure","Temperature"],"'No trace, wrong place.'"],
    ["A sudden loss of the capnography trace most urgently suggests what?","Displaced tube, obstruction or cardiac arrest",["Light anaesthesia together with mild hypothermia","Hypothermia","Hyperglycaemia"],"An immediate emergency requiring systematic checks."],
    ["Which nerve block is commonly used for abdominal wall analgesia?","TAP block",["Interscalene block","Femoral block","Bier's block"],"Transversus abdominis plane block."],
    ["Which regional technique is used for upper limb surgery via a tourniquet?","Bier's block",["A lumbar epidural","Spinal","TAP block"],"Intravenous regional anaesthesia."],
    ["A spinal anaesthetic is injected into which space?","The subarachnoid space",["The epidural fatty space","The subdural space","The intrathecal fat"],"Below the level of the conus medullaris."],
    ["Which complication classically causes a postural headache after neuraxial block?","Post-dural puncture headache",["An epidural haematoma or abscess","Meningitis","Nerve injury"],"Worse sitting up, relieved lying flat."],
    ["Which sensory level is usually required for caesarean section under spinal?","T4",["T10","L1","C6"],"Tested to light touch or cold."],
    ["What does a train-of-four ratio measure?","Depth of neuromuscular blockade",["The depth of hypnosis and analgesia","Analgesia","Oxygenation"],"A ratio above 0.9 suggests adequate reversal."],
    ["Which monitor is used to reduce the risk of accidental awareness?","Processed EEG such as BIS",["A peripheral nerve stimulator","Capnography","Pulse oximetry"],"Particularly relevant during TIVA with paralysis."],
    ["Which intravenous agent is most associated with pain on injection and a fall in blood pressure?","Propofol",["Ketamine","Etomidate","Thiopentone"],"Widely used for induction and TIVA."],
    ["Which induction agent best preserves cardiovascular stability in shock?","Ketamine",["Propofol","Thiopentone","Sevoflurane"],"It has sympathomimetic effects, though it is a myocardial depressant directly."],
    ["Which agent is associated with adrenal suppression after a single dose?","Etomidate",["Oral midazolam","Propofol","Ketamine"],"It inhibits 11-beta-hydroxylase."],
    ["What are the standard adult preoperative fasting times for food and clear fluids?","6 hours for food, 2 hours for clear fluids",["Nil by mouth from midnight, in every single case","12 hours and 6 hours","4 hours and 1 hour"],"The '6-4-2' rule includes breast milk at 4 hours."],
    ["Aspiration of gastric contents causing chemical pneumonitis is known as what?","Mendelson's syndrome",["The Boerhaave syndrome","Ludwig's angina","Mallory-Weiss"],"First described in obstetric anaesthesia."],
    ["Which reflex closure of the vocal cords may occur on emergence?","Laryngospasm",["Bronchospasm","Laryngomalacia","Stridor of croup"],"Treated with CPAP, deepening anaesthesia, or suxamethonium."],
    ["Which opioid has a context-sensitive half-time that stays very short?","Remifentanil",["Oral oxycodone","Morphine","Fentanyl"],"Metabolised by plasma esterases."],
    ["Which volatile agent is most commonly used for inhalational induction in children?","Sevoflurane",["Desflurane gas","Isoflurane","Halothane"],"It is less pungent and better tolerated."],
    ["Which volatile agent is most irritant to the airway, causing coughing?","Desflurane",["Sevoflurane","Isoflurane","Nitrous oxide"],"Avoided for gas induction."],
    ["Diffusion hypoxia on emergence is associated with which agent?","Nitrous oxide",["Sevoflurane gas","Propofol","Ketamine"],"Give supplemental oxygen at the end."],
    ["Which drug is used first-line for intraoperative anaphylaxis?","Adrenaline",["Hydrocortisone","Chlorphenamine","Salbutamol"],"Given IV in titrated doses with fluid resuscitation."],
    ["Prolonged apnoea after suxamethonium suggests deficiency of what?","Plasma cholinesterase",["Alpha-1 antitrypsin protein","G6PD","Factor VIII"],"Also called pseudocholinesterase deficiency."],
    ["Which serious complication of suxamethonium occurs in burns and denervation injury?","Hyperkalaemia",["Hypokalaemia","Hypercalcaemia","Hyponatraemia"],"Due to extrajunctional receptor proliferation."],
    ["Pulse oximetry works on which principle?","Differential absorption of red and infrared light",["A Doppler shift measured across the whole tissue bed","Impedance","Thermal conduction"],"It cannot distinguish carboxyhaemoglobin."],
    ["Which airway device sits above the larynx and does not protect against aspiration?","A supraglottic airway",["A cuffed tracheal tube","A tracheostomy","A double-lumen tube"],"Such as the laryngeal mask airway."],
    ["Which tube allows one-lung ventilation for thoracic surgery?","A double-lumen tube",["A reinforced tube","A microlaryngeal tube","A nasal RAE"],"Or a bronchial blocker."],
    ["What does ERAS stand for in perioperative care?","Enhanced Recovery After Surgery",["Emergency Resuscitation And Support","Elective Regional Anaesthetic Service","Early Rapid Airway Securing"],"Multimodal protocols to speed recovery."],
    ["Which multimodal strategy reduces opioid requirements after surgery?","Combining paracetamol, NSAIDs and regional blocks",["High-dose morphine on its own, or nitrous oxide alone","Nitrous oxide alone","Benzodiazepines alone"],"Central to opioid-sparing analgesia."],
    ["Which antiemetic class does ondansetron belong to?","5-HT3 antagonists",["Dopamine antagonists","Antihistamines","Anticholinergics"],"Widely used for PONV prophylaxis."],
    ["What is the most common cause of airway obstruction in an unconscious patient?","The tongue falling back",["An inhaled foreign body only","Laryngospasm","Bronchospasm"],"Relieved by head tilt and jaw thrust."],
    ["Which condition is suggested by a rising ETCO2, tachycardia, rigidity and hyperthermia?","Malignant hyperthermia",["A very severe thyroid storm","Sepsis","Anaphylaxis"],"Requires immediate dantrolene and cooling."],
    ["Which physiological principle explains preoxygenation extending safe apnoea time?","Denitrogenation increasing the functional residual capacity oxygen store",["A greatly increased cardiac output combined with a much reduced metabolic rate","Reduced metabolic rate","Bronchodilatation"],"FRC becomes an oxygen reservoir of around 2 litres."],
    ["What is the primary determinant of the speed of inhalational induction?","Low blood-gas solubility of the agent",["A high oil-gas solubility of the agent","High molecular weight","High boiling point"],"Desflurane and nitrous oxide have very low solubility."],
    ["What does the oil-gas partition coefficient predict?","Potency, correlating inversely with MAC",["The speed of induction and the metabolism","Speed of induction","Airway irritation"],"The Meyer-Overton correlation."],
    ["Which factors increase MAC?","Hyperthermia, chronic alcohol use and young age",["Hypothermia, opioids, pregnancy and advanced old age","Old age","Acute alcohol intoxication"],"Infants have the highest MAC around 6 months."],
    ["Which patient factor most increases risk of aspiration under anaesthesia?","Unfasted emergency surgery with a full stomach",["Well-controlled hypertension along with mild asthma","Mild asthma","Elective hernia repair"],"Rapid sequence induction is indicated."],
    ["What is the currently favoured evidence position on cricoid pressure?","Its benefit is contested and it may worsen laryngoscopic view",["It is universally mandatory and it reliably prevents aspiration","It reliably prevents aspiration","It improves the view"],"Practice has become more nuanced."],
    ["Which cardiac output monitor uses arterial waveform analysis?","Pulse contour analysis",["Pulmonary artery catheter","Transthoracic echo","Capnography"],"Calibrated and uncalibrated systems exist."],
    ["Which parameter guides goal-directed fluid therapy in ventilated patients?","Stroke volume variation",["Central venous pressure alone","Urine output alone","Heart rate alone"],"Valid only in fully ventilated, regular-rhythm patients."],
    ["Why is central venous pressure a poor predictor of fluid responsiveness?","It correlates poorly with preload and stroke volume response",["It cannot be measured without echo and it changes with temperature","It requires echo","It changes with temperature"],"Repeatedly demonstrated in systematic reviews."],
    ["What is the mechanism of malignant hyperthermia?","Uncontrolled calcium release via a defective ryanodine receptor",["Mitochondrial uncoupling by opioids with an excess of acetylcholine","Excess acetylcholine","Serotonin excess"],"RYR1 mutations most commonly."],
    ["How is malignant hyperthermia distinguished from neuroleptic malignant syndrome and serotonin syndrome?","MH follows volatile or suxamethonium exposure with rapidly rising ETCO2 and rigidity",["It follows SSRI use, it causes clonus and hyperreflexia, and it follows antipsychotic use","It causes clonus and hyperreflexia mainly","It follows antipsychotic use"],"Serotonin syndrome features clonus; NMS features lead-pipe rigidity after antipsychotics."],
    ["Which condition should prompt avoidance of suxamethonium due to hyperkalaemic arrest risk?","Burns beyond 24-48 hours, denervation injury and prolonged immobility",["Well-controlled asthma, a mild anaemia, and a long-standing hypertension","Mild anaemia","Hypertension"],"Upregulated extrajunctional receptors are the mechanism."],
    ["What is the recommended initial adult bolus of lipid emulsion in LAST?","1.5 ml/kg of 20% lipid emulsion",["10 ml/kg of the 20% lipid emulsion","0.1 ml/kg","50 ml regardless"],"Followed by an infusion, per AAGBI guidance."],
    ["Which block carries the highest risk of phrenic nerve palsy?","Interscalene block",["The axillary approach","TAP block","Femoral block"],"Nearly universal ipsilateral diaphragmatic paresis."],
    ["Which neuraxial complication requires emergency MRI and decompression within hours?","Epidural haematoma or abscess with cord compression",["Transient neurological symptoms occurring after a spinal","Post-dural puncture headache","Hypotension"],"Delay beyond 8-12 hours markedly worsens outcome."],
    ["What is the mechanism of sugammadex, and its key limitation?","It encapsulates aminosteroid relaxants; it does not reverse benzylisoquinoliniums",["It inhibits acetylcholinesterase and blocks the nicotinic receptors, reversing all relaxants","It blocks nicotinic receptors","It reverses all relaxants"],"Ineffective against atracurium and cisatracurium."],
    ["Which grade of the Cormack-Lehane classification denotes visualisation of the epiglottis only?","Grade 3",["Grade 1","Grade 2","Grade 4"],"Grade 4 shows neither glottis nor epiglottis."],
    ["In the 'can't intubate, can't oxygenate' scenario, what is the definitive step?","Emergency front-of-neck access via scalpel cricothyroidotomy",["Further intubation attempts, followed by awakening the patient","Awakening the patient","Nasal intubation"],"DAS guidelines emphasise early declaration and action."],
    ["Which drug combination causes the most severe perioperative anaphylaxis in UK audits?","Neuromuscular blocking agents and antibiotics",["Propofol and paracetamol when administered together","Nitrous oxide and oxygen","Midazolam and fentanyl"],"NAP6 identified these as leading triggers."],
    ["What is the principal advantage of TIVA with target-controlled infusion in a patient at MH risk?","It avoids all triggering agents",["It needs no monitoring whatsoever","It is faster to wake","It reverses rigidity"],"Propofol and remifentanil are safe in MH-susceptible patients."]

  pae: [
    ["What is the commonest cause of cardiac arrest in children?","Hypoxia from respiratory failure",["A sudden severe electrolyte disturbance","Ventricular fibrillation","Myocardial infarction"],"Paediatric arrests are usually respiratory in origin."],
    ["What is the paediatric compression-to-ventilation ratio for two trained rescuers?","15:2",["30:2","5:1","3:1"],"Ventilation matters far more in children than adults."],
    ["What initial resuscitation fluid bolus is recommended in a shocked child?","10 ml/kg of balanced crystalloid",["50 ml/kg of a balanced crystalloid","1 ml/kg","500 ml regardless"],"Reassess after each bolus; avoid fluid overload."],
    ["Which formula estimates weight in children aged 1-5 years (APLS)?","(Age + 4) × 2",["(Age + 20) × 10","Age × 10","Age × 5"],"Best practice is to weigh or use a length-based tape."],
    ["How is the correct uncuffed tracheal tube internal diameter estimated?","Age divided by 4, plus 4",["Age divided by 2, then plus 2","Age plus 2","Age times 2"],"Cuffed tubes use age/4 + 3.5."],
    ["Why are cuffed tubes now widely accepted in children?","Modern low-pressure cuffs reduce leak and reintubation without extra morbidity",["They are cheaper, they are far easier to insert, and they prevent all aspiration","They are easier to insert","They prevent all aspiration"],"Cuff pressure must still be monitored."],
    ["At what age does the narrowest part of the paediatric airway approximate the adult pattern?","Around 8 years, at the vocal cords",["From birth onwards, at the cricoid ring","Age 2","Age 16"],"Classically the cricoid was taught as narrowest in infants; imaging has refined this."],
    ["Why do infants desaturate faster than adults during apnoea?","Higher oxygen consumption and lower functional residual capacity",["Larger lungs, a much slower metabolism and a higher haemoglobin level","Slower metabolism","Higher haemoglobin"],"Preoxygenation buys much less time."],
    ["What is the standard preoperative fasting guidance for clear fluids in children?","1 hour in many modern guidelines",["12 hours in most modern guidelines","6 hours","4 hours"],"The move to 1 hour reduces distress and ketosis."],
    ["What are the fasting times for breast milk and formula respectively?","4 hours and 6 hours",["12 hours and 12 hours","2 and 2","6 and 6"],"Solids require 6 hours."],
    ["Which agent is commonly used for inhalational induction in children?","Sevoflurane",["Desflurane gas","Isoflurane","Enflurane"],"It is sweet-smelling and non-irritant."],
    ["Why is desflurane avoided for gas induction in children?","It is highly irritant and causes laryngospasm",["It is far too expensive and it is much too slow","It is too slow","It causes bradycardia"],"It may be used for maintenance in older children."],
    ["What is the most common perioperative critical incident in children?","Laryngospasm",["Anaphylaxis","Malignant hyperthermia","Awareness"],"Highest risk in young children with recent URTI."],
    ["How long should elective surgery ideally be deferred after a child's upper respiratory tract infection?","Around 2 to 4 weeks",["No delay at all is needed","1 day","6 months"],"Airway hyperreactivity persists after symptoms settle."],
    ["What is the initial management of laryngospasm in a child?","100% oxygen, CPAP and jaw thrust, then deepen anaesthesia",["An immediate surgical airway followed by chest compressions alone","Extubation","Chest compressions"],"Suxamethonium if it does not break."],
    ["Which dose of suxamethonium is used for laryngospasm in children?","Around 1-2 mg/kg intravenously",["Around 10 mg/kg given intravenously","0.1 mg/kg","A fixed 100 mg"],"Intramuscular dosing is higher if no IV access."],
    ["Why is atropine often given with suxamethonium in infants?","To prevent profound bradycardia",["To reduce the airway secretions only","To speed onset","To prolong the block"],"Vagal tone is dominant in infants."],
    ["Which paediatric caudal block is commonly used for sub-umbilical surgery?","Caudal epidural",["Interscalene block","Stellate ganglion block","Cervical plexus block"],"Performed via the sacral hiatus."],
    ["What volume of local anaesthetic is typically used for a caudal to reach lumbosacral levels?","Around 0.5 ml/kg",["Around 0.05 ml/kg","5 ml/kg","A fixed 20 ml"],"Armitage regimen guides volumes by desired level."],
    ["What is the maximum safe dose of levobupivacaine in children?","Around 2 mg/kg",["Around 20 mg/kg","10 mg/kg","0.1 mg/kg"],"Toxicity risk is higher due to volume of distribution differences."],
    ["Why are neonates more vulnerable to local anaesthetic toxicity?","Reduced protein binding and immature hepatic metabolism",["A higher muscle mass together with a much faster clearance","Faster clearance","Lower cardiac output only"],"Lower alpha-1 acid glycoprotein levels increase free drug."],
    ["What is the commonest cause of postoperative morbidity after paediatric tonsillectomy?","Pain and bleeding",["Malignant hyperthermia","Awareness","Nerve injury"],"Primary bleeding occurs within 24 hours."],
    ["Why is codeine contraindicated in children after tonsillectomy?","Ultra-rapid metabolisers risk fatal respiratory depression",["It is completely ineffective, and it is also far too expensive","It causes rash","It is too expensive"],"Following deaths, regulators restricted its use."],

let memStore = {};
function save(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){ memStore[k]=v; } }
function load(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return memStore[k]!==undefined?memStore[k]:d; } }

let audioCtx=null, soundOn = load("qpmed_sound", true);
function beep(freqs, dur){
  if(!soundOn) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    freqs.forEach((f,i)=>{
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type="sine"; o.frequency.value=f; o.connect(g); g.connect(audioCtx.destination);
      const t=audioCtx.currentTime + i*dur;
      g.gain.setValueAtTime(0.15,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
      o.start(t); o.stop(t+dur);
    });
  }catch(e){}
}
const sndRight=()=>beep([523,659,784],0.12), sndWrong=()=>beep([220,180],0.18), sndBadge=()=>beep([523,659,784,1047],0.11);

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function confetti(){
  const chars=["🎉","⭐","🌍","✨","🎈"];
  for(let i=0;i<18;i++){
    const el=document.createElement("div");

    el.style.left=Math.random()*95+"vw";
    el.style.animationDuration=(1.2+Math.random()*1.5)+"s";
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),3000);
  }
}

let round=null;
let gatePending=null;
function gateAsk(cat){
  const a=Math.floor(Math.random()*9)+3, b=Math.floor(Math.random()*8)+3, c=Math.floor(Math.random()*15)+5;
  gatePending={cat, ans:a*b+c};
  app.innerHTML=`
  <h1>🔒 Restricted Access</h1>
  <p class="sub">Consultant level — adults only. A quick sum to prove it!</p>
  <div class="card">
    <h2>Answer to continue</h2>
    <div class="question">${a} × ${b} + ${c} = ?</div>
    <input type="text" id="gans" inputmode="numeric" autocomplete="off" placeholder="Your answer">
    <div id="gmsg" class="streakflame"></div>
    <button class="btn primary center" onclick="gateCheck()">Unlock 🔓</button>
    <button class="btn ghost center" onclick="screenHome()">Back</button>
  </div>`;
  const inp=$("#gans"); if(inp){ inp.focus(); inp.addEventListener("keydown",e=>{ if(e.key==="Enter") gateCheck(); }); }
}
function gateCheck(){
  if(!gatePending) return screenHome();
  const v=parseInt(($("#gans").value||"").replace(/[^0-9-]/g,""),10);
  if(v===gatePending.ans){
    const cat=gatePending.cat; gatePending=null;
    sel.level=4; save("qpmed_level",4);
    startRound(cat);
  } else {
    const msg=$("#gmsg"); if(msg) msg.textContent="Not correct — try again.";
    const cat=gatePending.cat; gateAsk(cat);
    const m2=$("#gmsg"); if(m2) m2.textContent="Not correct — here's a new question.";
  }
}
function startRound(cat){
  sel.cat=cat;
  const bank = cat==="mix"
    ? shuffle([].concat(...Object.values(DATA[sel.level])))
    : shuffle(DATA[sel.level][cat]);
  round = { qs: bank.slice(0,ROUND_LEN), i:0, correct:0, streak:0, gained:0, newBadges:[] };
  showQuestion();
}
function showQuestion(){
  const p=profiles[curP], q=round.qs[round.i];
  const opts = shuffle([q[1],...q[2]]);
  const flagOpts = opts.every(isFlagEmoji);
  const streakTxt = round.streak>=3 ? `🔥 ${round.streak} in a row! Bonus points on!` : (round.streak>0?`🔥 Streak: ${round.streak}`:"");
  app.innerHTML = `
  <div class="topbar"><span class="pill">${CATS[sel.cat].emoji} ${CATS[sel.cat].name}</span><span class="pill">⭐ ${p.points+round.gained}</span></div>
  <div class="progress"><div style="width:${(round.i/ROUND_LEN)*100}%"></div></div>
  <div class="qnum">Question ${round.i+1} of ${ROUND_LEN}</div>
  <div class="streakflame">${streakTxt}</div>
  <div class="card">
    ${q[4]?`<div class="qimg">${ART[q[4]]||""}</div>`:""}
    <div class="question">${esc(q[0])}</div>
    <div id="opts">${opts.map(o=>`<button class="btn center" style="${flagOpts?'font-size:2.6rem;padding:10px':''}" data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div>
    <div id="after"></div>
  </div>`;
  $("#opts").addEventListener("click", e=>{
    const b=e.target.closest("button"); if(!b||round.answered) return;
    answer(b, b.dataset.o===q[1], q);
  });
}
function answer(btn, right, q){
  round.answered=true;
  const p=profiles[curP];
  document.querySelectorAll("#opts .btn").forEach(b=>{
    b.disabled=true;
    if(b.dataset.o===q[1]) b.classList.add("correct","bounce");
    else if(b===btn && !right) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  let msg;
  if(right){
    round.correct++; round.streak++;
    const bonus = round.streak>=3?5:0;
    round.gained += 10+bonus;
    p.correct++;
    if(round.streak>p.bestStreak) p.bestStreak=round.streak;
    msg = `<b>Correct! +${10+bonus} points${bonus?" (streak bonus!)":""}</b> 🎉`;
    sndRight(); confetti();
    grantIf("first", p.correct>=1);
    grantIf("streak5", round.streak>=5);
    grantIf("streak10", round.streak>=10);
  } else {
    round.streak=0;
    msg = `<b>Not quite!</b> The answer is <b>${esc(q[1])}</b>.`;
    sndWrong();
  }
  $("#after").innerHTML = `<div class="fact">${msg}<br><br>💡 <b>Fun fact:</b> ${esc(q[3])}</div>
    <button class="btn primary center" onclick="next()">${round.i+1<ROUND_LEN?"Next Question ➡️":"See My Score 🏁"}</button>`;
}
function next(){
  round.answered=false; round.i++;
  if(round.i<ROUND_LEN) showQuestion(); else finishRound();
}
function grantIf(id, cond){
  const p=profiles[curP];
  if(cond && !p.badges.includes(id)){ p.badges.push(id); round.newBadges.push(id); sndBadge(); }
}
function finishRound(){
  const p=profiles[curP];
  p.points += round.gained;
  if(!p.cats.includes(sel.cat) && sel.cat!=="mix") p.cats.push(sel.cat);
  grantIf("perfect", round.correct===ROUND_LEN);
  grantIf("expertperfect", round.correct===ROUND_LEN && sel.level>=3);
  grantIf("pts100", p.points>=100);
  grantIf("pts500", p.points>=500);
  grantIf("pts1000", p.points>=1000);
  grantIf("allcats", p.cats.length>=20);
  save("qpmed_profiles",profiles);
  const pct=round.correct/ROUND_LEN;
  const [em,txt] = pct===1?["🏆","PERFECT! You're a superstar!"]
    : pct>=0.75?["🎉","Amazing job, explorer!"]
    : pct>=0.5?["😃","Great effort — keep exploring!"]
    : ["🌱","Good try! Every explorer starts somewhere!"];
  if(pct>=0.75) confetti();
  app.innerHTML = `
  <h1>Round Complete!</h1>
  <div class="result-emoji">${em}</div><div style="text-align:center;margin:-6px 0 10px">${PUFFIN(56)}</div>
  <div class="card" style="text-align:center">
    <div class="bigscore">+${round.gained} points</div>
    <p style="margin:8px 0 4px;font-weight:700">${round.correct} / ${ROUND_LEN} correct</p>
    <p style="opacity:.85">${txt}</p>
  </div>
  ${round.newBadges.map(id=>{const b=BADGES.find(x=>x.id===id);return `<div class="newbadge">${b.i} New badge: <b>${b.n}</b>!</div>`;}).join("")}
  <button class="btn primary center" onclick="startRound(sel.cat)">Play Again 🔁</button>
  <button class="btn center" onclick="screenHome()">Choose Another Topic 🐧</button>
  <button class="btn ghost center" onclick="screenBadges()">See My Badges 🏅</button>`;
}

/* expose for inline handlers */
window.pickProfile=pickProfile; window.screenNewProfile=screenNewProfile; window.screenProfiles=screenProfiles;
window.setLevel=setLevel; window.startRound=startRound; window.screenHome=screenHome;
window.screenBadges=screenBadges; window.gateAsk=gateAsk; window.gateCheck=gateCheck; window.toggleSound=toggleSound; window.next=next; window.sel=sel;

/* start */
puffinBackdrop();
if(profiles.length===0) screenNewProfile(); else screenProfiles();
</script>
