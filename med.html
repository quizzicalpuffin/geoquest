<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quizzical Puffin">
<title>Puffin Medical · Revision</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(170deg,#0d3b66 0%,#1b6ca8 45%,#2e9fc4 75%,#7fd1e0 100%);
    background-attachment: fixed;
    color:#fff; min-height:100vh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    user-select:none; -webkit-user-select:none;
  }
  #app { max-width:480px; margin:0 auto; padding:16px; min-height:100vh; display:flex; flex-direction:column; }
  .card {
    background:rgba(8,32,54,.55); backdrop-filter:blur(9px); -webkit-backdrop-filter:blur(8px);
    border-radius:24px; padding:20px; margin-bottom:14px;
    border:1.5px solid rgba(255,255,255,.25);
  }
  h1 { font-size:2rem; text-align:center; text-shadow:0 2px 8px rgba(0,0,0,.25); }
  h2 { font-size:1.35rem; margin-bottom:12px; text-align:center; }
  .sub { text-align:center; opacity:.9; font-size:.95rem; margin:6px 0 18px; }
  .btn {
    display:block; width:100%; border:none; cursor:pointer;
    background:rgba(255,255,255,.92); color:#333; font-family:inherit;
    font-size:1.15rem; font-weight:700; padding:16px 18px; border-radius:18px;
    margin-bottom:12px; text-align:left; box-shadow:0 4px 0 rgba(0,0,0,.18);
    transition: transform .08s;
  }
  .btn:active { transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.18); }
  .btn.center { text-align:center; }
  .btn.primary { background:#FFD93D; color:#5b4400; }
  .btn.ghost { background:rgba(255,255,255,.18); color:#fff; box-shadow:none; border:1.5px solid rgba(255,255,255,.4); }
  .btn.correct { background:#4CAF50 !important; color:#fff !important; }
  .btn.wrong { background:#E5533D !important; color:#fff !important; }
  .btn.dim { opacity:.55; }
  .btn:disabled { cursor:default; }
  .row { display:flex; gap:10px; }
  .row .btn { flex:1; }
  .avatars { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:14px; }
  .avatars button {
    font-size:2.2rem; padding:12px 0; border-radius:16px; border:3px solid transparent;
    background:rgba(255,255,255,.18); cursor:pointer;
  }
  .avatars button.sel { border-color:#FFD93D; background:rgba(255,255,255,.35); }
  input[type=text] {
    width:100%; font-size:1.2rem; font-family:inherit; padding:14px; border-radius:16px;
    border:none; margin-bottom:14px; text-align:center; font-weight:700; color:#333;
  }
  .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; font-weight:800; font-size:1rem; }
  .pill { background:rgba(0,0,0,.22); border-radius:999px; padding:7px 14px; }
  .qnum { text-align:center; opacity:.9; font-weight:700; margin-bottom:8px; }
  .question { font-size:1.35rem; font-weight:800; text-align:center; margin-bottom:18px; line-height:1.35; }
  .bigflag { font-size:3.5rem; text-align:center; display:block; margin-top:8px; }
  .progress { height:10px; background:rgba(0,0,0,.22); border-radius:99px; margin-bottom:16px; overflow:hidden; }
  .progress div { height:100%; background:#FFD93D; border-radius:99px; transition:width .3s; }
  .fact {
    background:rgba(0,0,0,.25); border-radius:18px; padding:14px 16px; margin:4px 0 14px;
    font-size:1rem; line-height:1.45; animation:pop .3s;
  }
  .fact b { color:#FFD93D; }
  @keyframes pop { from { transform:scale(.9); opacity:0; } to { transform:scale(1); opacity:1; } }
  .bounce { animation:bounce .5s; }
  @keyframes bounce { 0%,100%{transform:scale(1)} 40%{transform:scale(1.15)} }
  .result-emoji { font-size:4rem; text-align:center; margin:10px 0; }
  .bigscore { font-size:2.6rem; font-weight:900; text-align:center; color:#FFD93D; text-shadow:0 2px 6px rgba(0,0,0,.3); }
  .badges { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
  .badge {
    width:96px; text-align:center; background:rgba(255,255,255,.15); border-radius:16px; padding:10px 4px;
    border:1.5px solid rgba(255,255,255,.25);
  }
  .badge .i { font-size:2rem; }
  .badge .n { font-size:.72rem; font-weight:700; margin-top:4px; }
  .badge.locked { opacity:.35; filter:grayscale(1); }
  .newbadge { text-align:center; background:rgba(255,217,61,.25); border:2px solid #FFD93D; border-radius:18px; padding:12px; margin-bottom:12px; animation:pop .4s; font-weight:700; }
  .streakflame { text-align:center; font-size:1.1rem; font-weight:800; color:#FFD93D; margin-bottom:10px; min-height:1.4em; }
  .confetti { position:fixed; top:-40px; font-size:1.6rem; pointer-events:none; animation:fall linear forwards; z-index:99; }
  @keyframes fall { to { transform:translateY(110vh) rotate(720deg); } }
  .profile-list .btn { display:flex; align-items:center; gap:12px; }
  .profile-list .av { font-size:1.8rem; }
  .profile-list .pts { margin-left:auto; font-size:.85rem; opacity:.7; font-weight:600; }
  .footerlink { text-align:center; opacity:.75; font-size:.85rem; margin-top:auto; padding:12px 0; }
  .grouphdr { font-weight:800; font-size:1.05rem; margin:16px 0 8px; padding-bottom:5px; border-bottom:2px solid rgba(255,255,255,.3); opacity:.95; }

  /* ---- puffin theme ---- */
  .puffbg { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .puffbg .seascape { position:absolute; inset:0; width:100%; height:100%; opacity:1; animation:none; }
  .puffbg .floater { position:absolute; opacity:.30; animation:bob 7s ease-in-out infinite; filter:drop-shadow(0 4px 10px rgba(0,0,0,.35)); }
  .puffbg .floater:nth-of-type(2){ animation-duration:9s; animation-delay:-2s; }
  .puffbg .floater:nth-of-type(3){ animation-duration:11s; animation-delay:-4s; }
  .puffbg .floater:nth-of-type(4){ animation-duration:8s; animation-delay:-1s; }
  .puffbg .floater:nth-of-type(5){ animation-duration:12s; animation-delay:-6s; }
  @keyframes bob { 0%,100%{ transform:translateY(0) rotate(-2deg);} 50%{ transform:translateY(-16px) rotate(2deg);} }
  #app { position:relative; z-index:1; }
  h1 .pufflogo { vertical-align:-14px; margin-right:6px; }
  .grouphdr.locked { border-bottom-color:#FFD93D; }
  .lockednote { font-size:.82rem; opacity:.85; margin:-4px 0 8px; }
  .btn.locked { background:rgba(255,255,255,.18); color:#fff; border:1.5px dashed rgba(255,255,255,.5); box-shadow:none; }
  .qimg { text-align:center; margin:0 0 14px; background:rgba(255,255,255,.1); border-radius:16px; padding:10px; }
  .qimg svg { display:block; margin:0 auto; max-width:100%; height:auto; max-height:180px; }
</style>
</head>

    ["This biconvex (lens-shaped) extra-axial collection is most typical of what?","An extradural haematoma",["A subdural haematoma","A subarachnoid haemorrhage","A cerebral abscess"],"Biconvex because it is limited by sutures, where the dura is tightly adherent.","nr_extradural"],

    ["Hyperdensity filling the basal cisterns in a star pattern indicates what?","Subarachnoid haemorrhage",["Extradural haematoma","Hydrocephalus","Diffuse axonal injury"],"Blood fills the CSF spaces around the circle of Willis.","nr_sah"],

    ["Which triad suggests normal pressure hydrocephalus?","Gait disturbance, urinary incontinence and dementia",["Headache, fever and neck stiffness","Ataxia, nystagmus and dysarthria","Ptosis, miosis and anhidrosis"],"Remembered as 'wet, wacky and wobbly'."],

    ["Invasion of which cartilage upstages laryngeal cancer to T4a?","Full-thickness thyroid cartilage with extralaryngeal spread",["Epiglottic cartilage","Arytenoid tip only","Hyoid bone alone"],"Affecting suitability for larynx preservation."],
    ["Which imaging finding suggests a cholesteatoma rather than granulation tissue?","Restricted diffusion on non-echo-planar DWI",["Enhancement after contrast","T2 hyperintensity alone","Bony sclerosis"],"Non-EPI DWI has largely replaced second-look surgery."],
    ["Which temporal bone finding indicates a labyrinthine fistula?","Erosion of the lateral semicircular canal",["Scutum erosion alone","Ossicular fixation","Mastoid opacification"],"A key preoperative warning."],
    ["What is the imaging hallmark of superior semicircular canal dehiscence, and its pitfall?","Absent bone over the canal on reformats, with partial volume artefact overcalling it",["Enlarged vestibular aqueduct","Cochlear malformation","Ossicular erosion"],"Reformats along Pöschl and Stenvers planes are essential."],
    ["An enlarged vestibular aqueduct is associated with which syndrome?","Pendred syndrome",["Alport syndrome","Usher syndrome","Waardenburg syndrome"],"Linked to SLC26A4 mutations."],
    ["Which sinonasal malignancy characteristically shows a low ADC and dural involvement in the olfactory recess?","Olfactory neuroblastoma",["Inverted papilloma","Antrochoanal polyp","Juvenile angiofibroma"],"Cysts at the tumour-brain interface are a classic clue."],
    ["Which finding differentiates fungal sinusitis with invasive features on MRI?","Loss of contrast enhancement of the mucosa, the black turbinate sign",["High T2 signal","Bone sclerosis","Air-fluid level"],"An early marker of angioinvasive disease."],
    ["Which parotid imaging feature most suggests malignancy?","Ill-defined margins with low ADC and perineural spread",["Bilateral lesions","Well-defined margins","T2 hyperintensity"],"Facial nerve involvement is critical to report."],
    ["What is the significance of the retropharyngeal node of Rouvière?","A first-echelon node for nasopharyngeal carcinoma",["A normal salivary gland","A vascular structure","A thymic remnant"],"Routinely assessed in NPC staging."],
    ["Which imaging classification guides management of thyroid nodules by combining features into a score?","ACR TI-RADS",["Bosniak","LI-RADS","PI-RADS"],"Determining FNA thresholds by size and score."],
    ["Which feature of a parathyroid adenoma on four-dimensional CT distinguishes it from a node?","Early arterial enhancement with rapid washout and a polar vessel",["Persistent enhancement","Calcification","Fatty hilum"],"A fatty hilum favours a lymph node."],
    ["Which space does a peritonsillar abscess occupy, and what is the key complication to exclude?","The peritonsillar space, with extension to the parapharyngeal space and vascular complications",["The retropharyngeal space only","The masticator space only","The carotid space only"],"Lemierre syndrome must be considered."],
    ["Lemierre syndrome involves thrombophlebitis of which vessel?","The internal jugular vein",["The carotid artery","The vertebral artery","The subclavian vein"],"Classically with Fusobacterium necrophorum and septic emboli."],
    ["Which imaging feature suggests a glomus vagale rather than a carotid body tumour?","Anterior displacement of both carotid arteries without splaying",["Splaying of the carotid bifurcation","Encasement of the vertebral artery","Intraluminal filling defect"],"Location above the bifurcation is key."],
    ["Which finding on temporal bone CT is critical to report before cochlear implantation?","Cochlear patency, nerve aplasia and aberrant facial nerve course",["Mastoid pneumatisation only","Sinus plate position only","Ossicular chain only"],"Cochlear nerve deficiency changes candidacy entirely."]

  echo: [
    ["What defines severe aortic stenosis on standard criteria?","Valve area under 1.0 cm², mean gradient 40 mmHg or more",["A valve area under 2.0 cm² with a mean gradient above 10 mmHg","A peak velocity above 2 m/s in every patient, whatever the flow","A dimensionless index above 0.5"],"The dimensionless index (LVOT VTI divided by aortic VTI) is invaluable when the LVOT diameter is hard to measure reliably."],
    ["In low-flow, low-gradient severe AS with a reduced ejection fraction, which test separates true from pseudo-severe disease?","Low-dose dobutamine stress echocardiography",["A treadmill exercise test taken to peak effort","Repeating the resting study after a week of intensive diuresis","A bubble contrast study"],"True severe stenosis shows a rising gradient with a fixed valve area; pseudo-severe shows the area opening up."],
    ["What effective regurgitant orifice area defines severe primary mitral regurgitation?","0.40 cm² or more",["0.05 cm² or more","Any measurable orifice whatsoever","1.5 cm²"],"For secondary MR the threshold is lower, at 0.20 cm², because the ventricle is already failing."],
    ["Which measurement most reliably estimates pulmonary artery systolic pressure?","Peak TR velocity plus estimated right atrial pressure",["The pulmonary acceleration time taken on its own","Left atrial volume indexed to body surface area","The size of the right ventricle measured in late diastole"],"When the TR signal is poor, a pulmonary acceleration time under 105 ms suggests raised pulmonary pressure."],
    ["What is the diagnostic hallmark of cardiac amyloidosis on strain imaging?","Apical sparing, the 'cherry on top' pattern",["Uniformly reduced strain across every single segment","Basal sparing with a completely normal apex","Normal strain throughout"],"Increased wall thickness alongside low ECG voltages is the classic amyloid mismatch."],
    ["Which echocardiographic sign is most specific for cardiac tamponade?","Right ventricular diastolic collapse",["Right atrial systolic collapse, which is rather more sensitive","A dilated inferior vena cava","A pericardial effusion"],"Right atrial collapse lasting more than a third of the cardiac cycle becomes both sensitive and specific."],
    ["What degree of respiratory variation in mitral inflow supports tamponade?","Greater than 25% variation",["Greater than 5% variation","No variation whatsoever across the cycle","Any variation at all"],"The tricuspid threshold is higher, at 40%, reflecting the greater right-sided respiratory effect."],
    ["Which finding best distinguishes constrictive pericarditis from restrictive cardiomyopathy?","Annulus reversus, with septal e' exceeding lateral e'",["A markedly raised E/e' ratio at the lateral annulus","Severe biatrial enlargement with a small ventricular cavity","A reduced global longitudinal strain across all the segments"],"Septal bounce and expiratory hepatic vein diastolic flow reversal both support constriction."],
    ["What TAPSE value indicates right ventricular systolic dysfunction?","Less than 17 mm",["Less than 5 mm","Anything under 30 mm","Under 25 mm"],"TAPSE reflects only longitudinal free-wall motion, so it can mislead badly after cardiac surgery."],
    ["In the 2016 ASE diastolic function algorithm, which four variables are assessed first?","e', E/e', LA volume index and TR velocity",["Ejection fraction, wall thickness, mass and left atrial size","The E/A ratio alone","Deceleration time only"],"If only one of the four is abnormal, diastolic function is reported as normal."],
    ["What is the normal value for left ventricular global longitudinal strain?","More negative than -18%",["Anywhere between 0% and -5%","About -2%","Exactly zero"],"Strain falls before ejection fraction does, which is why it detects cardiotoxicity early."],
    ["How is stroke volume calculated at the left ventricular outflow tract?","LVOT cross-sectional area multiplied by the VTI",["Ejection fraction multiplied by the heart rate","LVOT diameter multiplied by the peak velocity","End-diastolic volume minus the left atrial volume"],"Because the area uses the radius squared, a small diameter error doubles into the final result."],
    ["What is the pressure half-time formula for mitral valve area?","220 divided by the pressure half-time",["The pressure half-time divided into 100","The peak gradient multiplied by four","750 times the half-time"],"It is unreliable straight after balloon valvuloplasty and in significant aortic regurgitation."],
    ["Which mitral valve area defines severe mitral stenosis?","1.5 cm² or less",["Anything under 3.0 cm²","4.0 cm²","2.5 cm²"],"The Wilkins score predicts suitability for balloon valvuloplasty from mobility, thickening, calcification and subvalvular disease."],
    ["What is the mechanism of dynamic obstruction in hypertrophic cardiomyopathy?","Systolic anterior motion of the mitral valve",["Calcific restriction of the aortic valve leaflets","A fixed subaortic membrane","Rheumatic fusion of the commissures"],"The posteriorly directed MR jet is the clue that the regurgitation is secondary to SAM."],
    ["Which manoeuvre increases the LVOT gradient in hypertrophic cardiomyopathy?","The strain phase of the Valsalva manoeuvre",["Passive raising of both legs while supine","Squatting from a standing position","Handgrip exercise sustained for a full minute"],"Anything that reduces preload or afterload worsens the obstruction."],
    ["What is the characteristic wall motion pattern of Takotsubo syndrome?","Apical ballooning with basal hyperkinesis",["Isolated basal akinesis with a wholly normal apex","Global uniform hypokinesis","An akinetic lateral wall"],"The abnormality typically extends beyond a single coronary territory, which is the key clue."],
    ["What pressure half-time defines severe aortic regurgitation?","Less than 200 ms",["More than 500 milliseconds","About 400 ms","Over 600 ms"],"Holodiastolic flow reversal in the descending aorta is a strong supportive sign."],
    ["Which Doppler finding in the descending aorta supports severe aortic regurgitation?","Holodiastolic flow reversal",["Systolic flow acceleration only","Absent diastolic flow","A normal triphasic pattern"],"Reversal in the abdominal aorta is less sensitive but indicates more severe regurgitation."],
    ["What vena contracta width defines severe tricuspid regurgitation?","7 mm or more",["Anything above 2 mm","1 mm","3 mm"],"Severe tricuspid regurgitation often shows systolic flow reversal in the hepatic veins."],
    ["Which indexed effective orifice area defines severe patient-prosthesis mismatch?","Below 0.65 cm²/m²",["Above 1.2 cm²/m² in every case","Any gradient above 5 mmHg","Exactly 1.0 cm²/m²"],"Mismatch produces high gradients despite a structurally normal, well-functioning prosthesis."],
    ["How is prosthetic valve thrombus best distinguished from pannus?","Thrombus is softer, more mobile and more recent",["Pannus is always mobile and highly echogenic on imaging","They simply cannot be distinguished","Thrombus is denser than pannus"],"Pannus is dense fibrous ingrowth needing surgery, whereas thrombus may respond to thrombolysis."],
    ["What is the main advantage of transoesophageal echo in infective endocarditis?","Far better detection of vegetations and abscess",["A much better view of the cardiac apex than transthoracic","Superior assessment of the pericardium","More accurate ejection fraction"],"It is essential in prosthetic valve endocarditis, where transthoracic imaging is shadowed."],
    ["Which septal motion pattern indicates right ventricular pressure overload?","Systolic flattening, giving a D-shaped LV",["Exaggerated septal thickening throughout systole","Flattening confined entirely to diastole","A normal circular short axis"],"Volume overload flattens the septum in diastole; pressure overload flattens it in systole."],
    ["How is a shunt quantified as Qp:Qs on echocardiography?","Pulmonary stroke volume divided by systemic",["The colour jet width divided by the valve annulus","Right ventricular size divided by the left","Peak velocity across the defect"],"A ratio above 1.5 usually prompts consideration of closure in atrial septal defect."],
    ["Which atrial septal defect type is not amenable to device closure?","The sinus venosus defect",["A secundum defect with good rims","A patent foramen ovale","A small secundum defect"],"Sinus venosus defects are commonly associated with anomalous pulmonary venous drainage."],
    ["What is the Nyquist limit in colour Doppler?","Half the pulse repetition frequency",["Twice the pulse repetition frequency","The transducer frequency","The frame rate"],"Exceeding it causes aliasing, which the PISA method deliberately exploits."],
    ["Why can continuous wave Doppler measure very high velocities?","It has no range ambiguity limit",["It uses a much lower frequency probe","It samples one exact depth","It is angle independent"],"The trade-off is that it cannot tell you where along the beam the velocity arose."],
    ["What is the PISA method used to calculate?","Regurgitant flow rate and orifice area",["Chamber volumes across the whole cardiac cycle","Ejection fraction","Cardiac output"],"Shifting the colour baseline towards the jet makes the hemispheric shell measurable."],
    ["Why are eccentric mitral regurgitant jets often underestimated?","The Coanda effect flattens the wall-hugging jet",["They always occur in structurally normal valves","Colour Doppler cannot detect them whatsoever","The regurgitant volume is genuinely always small"],"Vena contracta and PISA are far more reliable than jet area for eccentric jets."],
    ["Which calculation gives cardiac output on echocardiography?","Stroke volume multiplied by heart rate",["Ejection fraction multiplied by the heart rate","LVOT area times the diameter","End-diastolic volume alone"],"Serial LVOT VTI is a practical bedside way to track fluid responsiveness."],
    ["What is the main limitation of the Teichholz method for ejection fraction?","It assumes uniform, symmetric contraction",["It requires a three-dimensional acquisition","It cannot be performed at the bedside","It needs contrast in every single patient"],"Simpson's biplane method of discs is preferred, and 3D is better still where images allow."],
    ["When is an ultrasound-enhancing contrast agent formally indicated?","When two or more segments are not seen",["In every routine outpatient examination","Only for valve assessment","Only in children"],"Contrast also improves detection of apical thrombus and left ventricular non-compaction."],
    ["What is the '60/60 sign' in suspected acute pulmonary embolism?","Acceleration time under 60 ms with RVSP under 60 mmHg",["A TAPSE of 60 mm alongside a heart rate of 60","Sixty per cent of the septum flattened during diastole","An ejection fraction of 60% with a stroke volume of 60 ml"],"McConnell's sign, free wall akinesia with a preserved apex, is another supportive finding."],
    ["What does McConnell's sign describe?","RV free wall akinesia with apical sparing",["Apical akinesia with a normal free wall","Global right ventricular hypokinesis","Left ventricular apical ballooning with basal sparing"],"It is reasonably specific for acute pulmonary embolism but is far from present in every case."],
    ["What aortic surveillance is recommended in bicuspid aortic valve disease?","Serial measurement of the root and ascending aorta",["A single baseline scan is sufficient for life","Measurement of the abdominal aorta only","No aortic imaging is required at all in these patients"],"Bicuspid aortopathy can progress even after the valve itself has been replaced."],
    ["Which Doppler pattern in the descending aorta suggests coarctation?","Continuous diastolic antegrade flow",["Complete absence of any systolic flow","A normal triphasic waveform","Reversed systolic flow"],"The diastolic 'tail' reflects a pressure gradient persisting across the narrowing all cycle long."],
    ["What is the principal advantage of speckle tracking over tissue Doppler?","It is largely independent of insonation angle",["It requires no electrocardiogram gating whatsoever","It works without any image at all","It measures pressure directly"],"Strain values still vary between vendors, so serial studies should stay on one platform."],
    ["What causes the E/e' ratio to overestimate filling pressure?","Heavy mitral annular calcification or a prosthesis",["A completely normal left atrium in a young adult","An entirely normal ejection fraction on its own","Any degree of tricuspid regurgitation seen whatsoever"],"E/e' is also unreliable in significant mitral valve disease and in constrictive pericarditis."],
    ["Which three-dimensional measurement best grades functional mitral regurgitation?","Vena contracta area measured en face",["The two-dimensional jet area alone","Left atrial diameter measured in systole","Peak regurgitant velocity on continuous wave"],"Functional MR orifices are crescentic, so a single 2D vena contracta width understates them."],
    ["This parasternal long-axis view shows what?","A large pericardial effusion",["A dilated left ventricle with a normal pericardium","Severe mitral stenosis","A normal study"],"The circumferential echo-free space separates the two pericardial layers.","ecq_effusion"],
    ["Which diagnosis does this systolic long-axis view show?","Hypertrophic cardiomyopathy with SAM",["Severe calcific aortic stenosis with a dilated root","A normal septum","Amyloid infiltration"],"The anterior leaflet is drawn into the outflow tract during systole.","ecq_hcm"],
    ["What is the abnormality on this long-axis view?","A vegetation on the mitral leaflet",["A calcified annulus with no discrete mobile mass","A left atrial myxoma","Chordal rupture"],"Mobility and independent motion distinguish a vegetation from calcification.","ecq_veg"],
    ["What does the mitral leaflet shape here indicate?","Rheumatic mitral stenosis",["A flail posterior leaflet causing severe regurgitation","A normal valve","Mitral annular calcification"],"Restricted tips with a mobile body give the classic hockey-stick appearance.","ecq_ms"],
    ["What does the septal shape on this short-axis view indicate?","Right ventricular pressure overload",["Isolated left ventricular hypertrophy with normal loading","Volume overload alone","A normal study"],"Systolic flattening indicates pressure overload; diastolic flattening indicates volume.","ecq_dseptum"],
    ["This systolic apical view is most consistent with what?","Takotsubo apical ballooning",["A single left anterior descending territory infarction","Global dilated cardiomyopathy","A normal ventricle"],"The abnormality crosses coronary territories, which is the key clue.","ecq_apical"],
    ["What does this aortic Doppler envelope indicate?","Severe stenosis, from the late peak",["A normal valve with a high cardiac output state","Mild stenosis","Aortic regurgitation"],"A rounded, late-peaking envelope suggests more severe obstruction.","ecq_cwas"]
  ],
  mri: [
    ["What fundamental property of protons does MRI exploit?","Nuclear spin and its magnetic moment",["The electrical charge carried by the orbiting electrons","Their radioactive decay","Their mass difference from neutrons"],"Hydrogen is used because it is abundant and has a large gyromagnetic ratio."],
    ["What is the Larmor frequency proportional to?","The main magnetic field strength",["The echo time chosen by the operator","The slice thickness","The receiver bandwidth"],"It equals the gyromagnetic ratio times B0, about 64 MHz at 1.5 tesla."],
    ["What does T1 relaxation describe?","Recovery of longitudinal magnetisation",["The decay of transverse magnetisation over time","Proton density in the voxel","Chemical shift artefact"],"It reflects energy exchange with the surrounding lattice."],
    ["What does T2 relaxation describe?","Decay of transverse magnetisation",["The regrowth of the longitudinal magnetisation vector","The Larmor precession rate","Spin density"],"It is caused by spins dephasing through spin-spin interactions."],
    ["What distinguishes T2* from true T2?","It also includes field inhomogeneity effects",["It reflects only the spin-spin interactions within the tissue","It is always longer than the true T2 value","It applies only to fat"],"A spin echo refocuses the T2* component, recovering true T2."],
    ["On a T1-weighted image, how does fat appear?","Bright",["Dark, with much lower signal than water","Identical to water","Signal void"],"Its short T1 gives rapid longitudinal recovery and high signal."],
    ["On a T2-weighted image, how does simple fluid appear?","Bright",["Dark, because of its very short T2","Grey, matching muscle","Signal void"],"Its long T2 preserves transverse magnetisation and high signal."],
    ["What is the purpose of the phase-encoding gradient?","To spatially encode one image axis",["To excite only the selected imaging slice","To refocus the spin echo","To suppress the fat signal"],"Each phase-encode step fills one line of k-space."],
    ["What does k-space represent?","The spatial frequency data of the image",["A direct map of tissue proton density across the whole slice","The magnetic field map of the bore","The gradient coil layout"],"The centre of k-space holds contrast; the periphery holds fine detail."],
    ["What causes chemical shift artefact?","The resonance difference between fat and water",["Movement of the patient at some point during the acquisition","Metal in the imaging field","Incomplete fat saturation"],"Fat and water differ by about 3.5 parts per million."],
    ["What is the specific absorption rate a measure of?","Radiofrequency energy deposited as heat",["The static field strength at the isocentre","Gradient slew rate limits","Acoustic noise output"],"It is a key safety limit, especially at higher field strengths."],
    ["Why are gradient coils responsible for the loud knocking noise?","Lorentz forces make them vibrate rapidly",["Radiofrequency pulses resonate in the bore","The cryogen boils audibly","The patient table motor is loud"],"Rapid switching in the static field flexes the coils mechanically."],
    ["What is the main safety hazard of the static magnetic field?","The projectile effect on ferromagnetic objects",["The cumulative ionising radiation dose delivered to the patient","Cumulative tissue heating over the scan","Contrast nephrotoxicity"],"An oxygen cylinder can become lethal in the bore."],
    ["What agent is most commonly used for MRI contrast?","Gadolinium chelates",["Iodinated water-soluble compounds","Barium sulphate suspension","Microbubbles"],"Gadolinium shortens T1, brightening enhancing tissue."],
    ["Which condition is associated with gadolinium in severe renal impairment?","Nephrogenic systemic fibrosis",["Contrast-induced encephalopathy","Anaphylactoid pseudo-allergy","Thyroid storm"],"Macrocyclic agents carry a much lower risk than linear ones."],
    ["What does a short TE and short TR produce?","A T1-weighted image",["A predominantly T2-weighted image","A proton-density image","A diffusion map"],"Long TR and long TE give T2 weighting instead."],
    ["What does diffusion-weighted imaging measure?","Brownian motion of water molecules",["The rate of blood flow through capillaries","Fat fraction within a voxel","Longitudinal relaxation only"],"Restricted diffusion in acute stroke shows as high DWI signal."],
    ["What does a low ADC value indicate on diffusion imaging?","Restricted diffusion",["Freely diffusing water in that voxel","Absence of any signal","Pure T2 shine-through"],"Acute infarct and dense cellular tumours both restrict diffusion."],
    ["What is the principle behind fat suppression by STIR?","Nulling fat using its short T1 inversion time",["Saturating the fat signal at its own resonant frequency alone","Dephasing fat with a gradient","Subtracting a fat-only image"],"STIR is robust to field inhomogeneity, unlike frequency-selective methods."],
    ["What limits the maximum gradient switching rate in practice?","Peripheral nerve stimulation",["The acoustic noise regulations alone","Cryogen boil-off rate","Receiver bandwidth"],"Rapidly changing fields can induce currents in nerves."],
    ["What is the purpose of a spin echo's 180-degree pulse?","To refocus dephased spins",["To tip magnetisation into the transverse plane","To select the imaging slice","To spoil residual magnetisation"],"It reverses the phase to cancel static field inhomogeneity."],
    ["Why does flowing blood often appear dark on spin echo?","Excited spins leave the slice before readout",["The iron within the haemoglobin molecule creates a signal void","Blood has an extremely short T1 value","Turbulence dephases the water"],"This time-of-flight loss is the classic flow void."],
    ["What is the basis of time-of-flight MR angiography?","Inflow of unsaturated spins into the slice",["Injection of a timed intravenous gadolinium contrast bolus","Phase shifts from moving spins","Susceptibility from deoxyhaemoglobin"],"Stationary tissue is saturated, so only inflowing blood is bright."],
    ["What does BOLD contrast in functional MRI depend on?","Changes in deoxyhaemoglobin concentration",["The direct electrical firing activity of the cortical neurons","Glucose uptake in active cortex","Cerebral temperature change"],"Deoxyhaemoglobin is paramagnetic and reduces local T2* signal."],
    ["What causes a susceptibility artefact?","Local field distortion at tissue interfaces",["Patient motion occurring between successive phase-encode steps","Aliasing of signal from outside the field","Chemical shift of fat"],"It is worst near metal, air-bone interfaces and blood products."],
    ["Which sequence is most sensitive to small haemorrhages?","Susceptibility-weighted imaging",["A standard T1 spin echo sequence","Short-TI inversion recovery","Balanced steady-state free precession"],"Blood products create strong local field inhomogeneity."],
    ["What is aliasing, or wrap-around, in MRI?","Signal outside the field mapped inside it",["Blurring caused by an excessively long echo train length","A metal-induced signal void","Fat and water cancelling out"],"It occurs when the field of view is smaller than the object."],
    ["What is the Ernst angle?","The flip angle giving maximum signal for a TR",["The angle at which the fat and water signals are exactly in phase","The slice-select gradient angle","The angle of the receiver coil"],"It depends on the T1 of the tissue and the repetition time."],
    ["Why does 3 tesla give higher signal than 1.5 tesla?","Greater net longitudinal magnetisation",["A shorter Larmor frequency at that field","Reduced chemical shift artefact","Lower specific absorption rate"],"Signal-to-noise scales roughly linearly with field strength."],
    ["What is a drawback of imaging at 3 tesla?","Increased specific absorption rate",["Markedly reduced signal-to-noise ratio","Loss of all chemical shift","Inability to use surface coils"],"Both SAR and susceptibility artefact worsen with field strength."],
    ["What does the repetition time TR primarily control?","T1 weighting of the image",["The spatial resolution in the phase direction","Chemical shift magnitude","Acoustic noise level"],"A short TR emphasises differences in longitudinal recovery."],
    ["What does the echo time TE primarily control?","T2 weighting of the image",["The number of slices acquired per sequence","The gradient slew rate","Fat suppression quality"],"A long TE allows greater T2 dephasing to develop."],
    ["What is parallel imaging used to achieve?","Faster acquisition using coil sensitivity maps",["Greater homogeneity of the main static magnetic field","Complete removal of motion artefact","Elimination of chemical shift"],"SENSE and GRAPPA reduce phase-encode steps at a signal cost."],
    ["What quenches a superconducting MRI magnet?","Sudden loss of superconductivity boiling the cryogen",["A routine software command entered at the operator console","Switching off the gradient amplifiers","Removing the radiofrequency coil"],"A quench vents helium and must exhaust safely outside."],
    ["Why must the quench pipe remain unobstructed?","To prevent asphyxiation from vented helium",["To keep the gradient coils adequately cool during long scans","To maintain field homogeneity","To reduce acoustic noise"],"A blocked pipe can displace oxygen in the scan room."],
    ["What is balanced steady-state free precession good for?","High signal cardiac and fluid imaging",["Suppressing all vascular signal throughout the imaged volume","Diffusion mapping of the brain","Fat-only imaging"],"It gives a high signal but is prone to banding artefact."],
    ["What is the Dixon technique used for?","Separating fat and water images",["Reducing peripheral nerve stimulation","Mapping the B0 field only","Accelerating diffusion imaging"],"It exploits the phase difference between fat and water signals."],
    ["What does T2 shine-through describe on diffusion imaging?","High DWI signal from long T2, not restriction",["A genuine acute infarct showing a correspondingly low ADC","A susceptibility void from blood","Motion-related ghosting"],"Checking the ADC map distinguishes it from genuine restriction."],
    ["Why is titanium generally MRI-conditional?","It is only weakly paramagnetic, not ferromagnetic",["It completely blocks the transmitted radiofrequency field","It shortens T1 dramatically","It is radiolucent"],"It causes far less artefact and force than ferromagnetic steel."],
    ["What is the main determinant of image signal-to-noise ratio?","Voxel volume, field strength and averages",["The length of the echo train used in the readout alone","The slice-select gradient strength","The console refresh rate"],"Larger voxels and more averages both raise SNR at a cost."],
    ["What safety zone concept governs MRI suite access?","The four-zone controlled access model",["A single locked door to the magnet room","Radiation dose monitoring badges","A lead-lined shielded booth"],"Zone IV is the magnet room itself, with the strictest control."]
  ],
  ctp: [
    ["What does a CT scanner physically measure?","X-ray attenuation along many paths",["The magnetic relaxation of tissue protons","Reflected ultrasound echoes","Emitted gamma photons"],"A rotating tube and detectors sample the body from all angles."],
    ["What are Hounsfield units scaled to?","Water at zero and air at minus 1000",["Bone at zero and fat set to a value of plus 1000","Muscle at zero and blood at 100","Air at zero and lead at 3000"],"Dense cortical bone reaches around plus 1000 or more."],
    ["What Hounsfield value does fat typically show?","Around minus 100",["Around plus 400, close to trabecular bone","Around plus 40, like soft tissue","Around zero, matching water"],"Its negative value helps identify fat-containing lesions."],
    ["What does windowing on a CT image change?","The displayed grey-scale range only",["The actual radiation dose to the patient","The reconstructed slice thickness","The tube voltage used"],"Narrow windows increase contrast between similar tissues."],
    ["What does increasing tube current (mAs) do?","Reduces image noise but raises dose",["Lowers the patient radiation dose received","Changes the beam energy spectrum","Alters the slice thickness only"],"Noise falls roughly with the square root of the dose."],
    ["What does tube voltage (kVp) principally control?","The energy and penetration of the beam",["The total number of photons produced only","The gantry rotation speed","The couch pitch"],"Lower kVp boosts iodine contrast but raises noise."],
    ["What is pitch in helical CT?","Couch travel per rotation over beam width",["The angle of the detector array to the beam","The reconstructed voxel size","The tube heat capacity"],"A pitch above 1 speeds scanning but can reduce dose and resolution."],
    ["What is beam hardening?","Preferential absorption of low-energy photons",["Scatter reaching the detector from outside the slice","Motion of the patient during rotation","Detector electronic drift"],"It causes dark streaks between dense structures like the petrous bones."],
    ["What causes streak artefact from metal implants?","Photon starvation and beam hardening",["The chemical shift difference between the fat and the water","Aliasing of the reconstruction","Cardiac motion"],"Iterative and dual-energy techniques can reduce it substantially."],
    ["What does a bow-tie filter do?","Shapes the beam to match body thickness",["Removes all scattered radiation at the detector","Converts X-rays directly into an image","Cools the X-ray tube"],"It reduces dose to the thinner periphery of the patient."],
    ["What is the CT dose index (CTDI) a measure of?","Radiation output per slice of a protocol",["The effective dose delivered to a specific radiosensitive organ","The image signal-to-noise ratio","The contrast volume injected"],"It is standardised using cylindrical phantoms."],
    ["What does the dose-length product estimate?","Total dose across the scanned length",["The peak radiation dose to the skin at a single point","The tube heat loading","The contrast clearance rate"],"Multiplying by a conversion factor gives approximate effective dose."],
    ["What is the main advantage of iterative reconstruction?","Lower dose for equivalent image noise",["Faster gantry rotation than filtered back projection","Complete removal of metal artefact","Elimination of the need for contrast"],"It models the physics and statistics rather than a simple inversion."],
    ["What does filtered back projection do?","Reconstructs an image from projections",["Directly measures Hounsfield units in tissue","Suppresses beam hardening physically","Removes patient motion"],"It applies a filter, then smears projections back across the field."],
    ["What underlies dual-energy CT?","Scanning at two different photon energies",["Using two separate contrast agents at once","Doubling the gantry rotation speed","Acquiring two phases of respiration"],"Materials attenuate differently at each energy, allowing separation."],
    ["What clinical problem is dual-energy CT useful for?","Characterising urinary and gout stones",["Measuring cerebral blood oxygenation directly","Imaging without any radiation dose","Detecting acute ischaemic stroke alone"],"It can also create virtual non-contrast images."],
    ["Why is iodine an effective CT contrast agent?","Its high atomic number strongly attenuates X-rays",["It emits its own gamma rays that the detectors can register","It shortens the tissue T1 relaxation time","It reflects the X-ray beam"],"The K-edge of iodine sits usefully within the diagnostic energy range."],
    ["What is the main renal risk of iodinated contrast?","Contrast-associated acute kidney injury",["Nephrogenic systemic fibrosis of the skin","Permanent nephron loss in all patients","Radiation nephritis"],"Adequate hydration is the main preventive measure."],
    ["What is a helical, or spiral, CT acquisition?","Continuous rotation with couch movement",["A single stationary slice taken repeatedly","Imaging without any tube rotation","A projection using only one detector row"],"It allows fast volumetric coverage in a single breath-hold."],
    ["What advantage do multi-detector rows give?","Wider coverage and thinner slices per rotation",["A consistently lower tube voltage requirement in every case","Complete elimination of scatter","Freedom from any motion artefact"],"Modern scanners can cover the whole heart in one rotation."],
    ["What is partial volume effect?","Averaging of different tissues in one voxel",["Loss of image signal caused by movement of the patient","Beam hardening between dense bones","Detector saturation from high dose"],"Thinner slices reduce it at the cost of more noise."],
    ["What is the ALARA principle in CT?","Keep dose as low as reasonably achievable",["Always use the largest available field of view","Acquire the maximum number of phases","Reconstruct at the thinnest possible slice"],"It balances diagnostic quality against radiation risk."],
    ["Why are children more radiosensitive in CT?","Dividing tissues and a long life ahead",["Their smaller body absorbs far more total dose","They cannot be given any contrast agent","Their organs attenuate X-rays more strongly"],"Paediatric protocols use markedly reduced dose settings."],
    ["What does automatic tube current modulation do?","Varies mAs with body region thickness",["Fixes the current for the whole scan length","Switches off the beam over dense bone","Doubles the dose over the abdomen"],"It lowers dose while keeping noise roughly constant."],
    ["What is CT perfusion used to assess?","Regional blood flow, as in acute stroke",["The magnetic susceptibility of the tissue being imaged","Bone mineral density only","Fat fraction of the liver"],"It tracks a contrast bolus over repeated rapid scans."],
    ["What is a scout, or topogram, image?","A low-dose projection for planning",["The final diagnostic reconstruction","A dual-energy material map","A three-dimensional volume render"],"It sets the scan range and modulation profile."],
    ["What limits temporal resolution in cardiac CT?","Gantry rotation speed",["The tube voltage selected by the operator","The reconstructed matrix size","The contrast concentration used"],"Dual-source scanners improve it by using two tube-detector pairs."],
    ["What is ECG gating used for in cardiac CT?","Freezing motion at a chosen cardiac phase",["Reducing the iodine contrast dose needed","Increasing the spatial resolution directly","Removing beam hardening from calcium"],"Prospective gating triggers the scan in diastole to cut dose."],
    ["What does a calcium score quantify?","Coronary artery calcified plaque burden",["The volume of contrast reaching the myocardium","Left ventricular ejection fraction","The degree of luminal stenosis directly"],"A higher Agatston score signals greater cardiovascular risk."],
    ["What is the K-edge of a contrast material?","A sharp rise in attenuation at one energy",["The maximum tube voltage that the agent can safely tolerate","Its boiling point during injection","The edge of its detectable concentration"],"Matching beam energy to it maximises contrast enhancement."],
    ["Why does lowering kVp increase iodine conspicuity?","Beam energy nears the iodine K-edge",["Fewer photons scatter at low energy always","The tube current rises automatically","Slice thickness decreases"],"The trade-off is a noisier image needing more current."],
    ["What is photon starvation?","Too few photons reaching the detector",["An excess of photons saturating detectors","Scatter dominating the primary beam","Beam hardening across soft tissue"],"It causes streaks through the shoulders and pelvis."],
    ["What are Hounsfield units of acute blood typically?","Around 50 to 70",["Around minus 100, like body fat","Around plus 1000, like cortical bone","Around zero, matching water"],"Hyperacute clot appears dense, then fades as it breaks down."],
    ["What does a virtual non-contrast image do?","Removes iodine using dual-energy data",["Reconstructs without any radiation dose","Adds contrast to a plain scan digitally","Suppresses all bone from the image"],"It can spare the patient a separate true non-contrast scan."],
    ["What is the effective dose unit in CT?","The millisievert",["The Hounsfield unit","The gray per rotation","The becquerel"],"It weights organ doses by their radiosensitivity."],
    ["What image feature does a sharp reconstruction kernel enhance?","Spatial resolution, at the cost of noise",["The overall contrast between soft tissues","The signal-to-noise ratio directly","The Hounsfield accuracy of fat"],"Bone and lung use sharp kernels; soft tissue uses smoother ones."],
    ["What is the primary source of scatter in CT?","Compton interactions within the patient",["The photoelectric effect in the detector","Beam hardening at the bow-tie filter","Electronic noise in the tube"],"Anti-scatter grids at the detector reduce its effect."],
    ["Which interaction dominates soft-tissue contrast at diagnostic energies?","The photoelectric effect",["Pair production above the tissue threshold","Coherent Rayleigh scattering only","Nuclear photodisintegration"],"Its strong dependence on atomic number underlies iodine contrast."],
    ["What does a wider detector collimation increase?","Coverage and usually dose efficiency",["The spatial resolution along the z-axis","The tube rotation time per slice","The contrast agent requirement"],"It reduces the relative overranging at the ends of a helix."],
    ["What is overranging in helical CT?","Extra rotations needed for reconstruction",["Scanning a distance beyond the couch travel limit set","Exceeding the tube heat capacity","Using too high a pitch value"],"It adds dose outside the planned range, worse at high pitch."],
    ["What is the main benefit of tin filtration at high kVp?","Removing low-energy photons to cut dose",["Increasing iodine contrast at the K-edge","Improving temporal resolution of the heart","Eliminating metal streak artefact"],"It is especially useful for low-dose lung and stone protocols."]
  ],
  usp: [
    ["What does diagnostic ultrasound use to form an image?","Reflected high-frequency sound echoes",["Ionising X-ray photons crossing the body","Magnetic relaxation of protons","Emitted positrons"],"Piezoelectric crystals both send pulses and receive their echoes."],
    ["What generates the ultrasound pulse in a transducer?","The piezoelectric effect",["A rotating anode and heated filament","A radiofrequency coil","A collimated photon source"],"Applying voltage deforms the crystal, producing sound."],
    ["What is the typical frequency range of diagnostic ultrasound?","Roughly 2 to 15 megahertz",["Around 20 to 200 hertz, just above hearing","Around 50 to 60 kilohertz","Around 1 to 5 gigahertz"],"Higher frequencies give better resolution but less penetration."],
    ["What is the trade-off of using a higher frequency probe?","Better resolution but shallower penetration",["Considerably deeper penetration but with much poorer detail","Higher dose but faster scanning","Reduced artefact at every depth"],"Deep abdominal work uses low frequencies; superficial work uses high."],
    ["What determines axial resolution?","The spatial pulse length",["The width of the ultrasound beam laterally","The frame rate of the display","The gain setting chosen"],"Shorter pulses, favoured by higher frequency, improve it."],
    ["What mainly determines lateral resolution?","The width of the ultrasound beam",["The pulse repetition frequency alone","The overall system gain","The dynamic range setting"],"Focusing narrows the beam and sharpens lateral detail."],
    ["How is depth of a reflector calculated?","From the echo return time",["From the amplitude of the returning echo","From the transmit frequency alone","From the probe temperature"],"The machine assumes a fixed speed of sound of 1540 metres per second."],
    ["What speed of sound does an ultrasound machine assume?","About 1540 metres per second",["About 340 metres per second, as in air","About 3 times ten to the eight metres per second","About 1 metre per second"],"Errors arise when tissue speed differs, as in fat."],
    ["What causes acoustic shadowing?","Strong reflection or absorption at a structure",["Enhanced transmission through a simple fluid-filled space","Reverberation between two flat surfaces","Refraction at a curved edge"],"Gallstones and calcified plaques cast classic shadows."],
    ["What causes posterior acoustic enhancement?","Low attenuation through a fluid-filled area",["A strong reflection occurring at a very dense interface","Beam refraction at a lens-like structure","Side-lobe artefact"],"Simple cysts brighten the tissue behind them."],
    ["What is the piezoelectric effect the basis of?","Both producing and detecting ultrasound",["Generating the X-ray beam in the tube","Shortening tissue T1 relaxation","Amplifying the returning signal electronically"],"The same crystal transmits and then listens for echoes."],
    ["What does the Doppler effect measure in ultrasound?","Blood flow velocity and direction",["The stiffness of a solid tissue mass","The attenuation of a bony structure","The temperature of the probe face"],"A frequency shift arises from moving red blood cells."],
    ["Why does the Doppler angle matter?","Cosine of the angle scales the velocity",["It sets the pulse repetition frequency of the whole system","It determines the transmit power","It fixes the axial resolution"],"An angle near 90 degrees badly underestimates true velocity."],
    ["What is aliasing in colour or spectral Doppler?","Velocity exceeding the Nyquist limit",["Sound reflecting off two parallel walls","Beam bending at a fatty interface","Loss of signal from deep structures"],"It wraps high velocities to the opposite direction on the display."],
    ["What is the Nyquist limit in pulsed Doppler?","Half the pulse repetition frequency",["Twice the transmit frequency of the probe","The maximum gain the system allows","The focal depth of the beam"],"Exceeding it causes aliasing of the velocity signal."],
    ["What is a key advantage of continuous-wave Doppler?","No aliasing, measuring very high velocities",["Precise localisation of the exact depth being sampled","Lower acoustic output to the patient","Better grey-scale resolution"],"The trade-off is range ambiguity along the beam."],
    ["What does time-gain compensation correct for?","Attenuation of echoes with depth",["Motion of the patient during scanning","The Doppler angle of insonation","Refraction at tissue boundaries"],"It brightens deep echoes so uniform tissue looks even."],
    ["What causes reverberation artefact?","Sound bouncing between two strong reflectors",["Complete absorption of the beam at a very dense structure","Refraction through a rounded organ","Excessive time-gain compensation"],"Equally spaced lines appear deep to the reflectors."],
    ["What is comet-tail artefact associated with?","Small strongly reflective objects",["A large simple fluid-filled cyst deep within an organ","Uniform homogeneous soft tissue","A deep acoustic shadow"],"It is a form of reverberation, seen with metal or cholesterol crystals."],
    ["What is the mirror-image artefact caused by?","Reflection at a strong curved interface",["Overlapping of two adjacent scan planes during sweeping","Aliasing of the colour Doppler signal","Beam hardening in dense tissue"],"The diaphragm can create a false liver above itself."],
    ["What does acoustic impedance depend on?","Tissue density and the speed of sound",["The chosen transmit frequency of the ultrasound probe","The gain and dynamic range settings","The patient's temperature only"],"Large impedance mismatches produce strong reflections."],
    ["Why is coupling gel used?","To exclude air, which reflects sound strongly",["To cool the transducer face down during a long scan","To magnify the returning echoes","To reduce the output needed"],"Air's huge impedance mismatch would otherwise block transmission."],
    ["What is the mechanical index a measure of?","Risk of cavitation from the beam",["The heating of tissue during a scan","The spatial resolution achieved","The frame rate of the display"],"It matters most where gas bodies, such as lung, are present."],
    ["What is the thermal index a measure of?","Potential tissue heating by the beam",["The likelihood of bubble cavitation occurring in tissue","The penetration depth achievable","The Doppler frequency shift"],"Separate indices exist for soft tissue, bone and cranial scanning."],
    ["What is the ALARA principle in ultrasound?","Keep exposure as low as reasonably achievable",["Always maximise the transmit power that is available","Use the highest frequency at every depth","Scan for the longest tolerable time"],"Output should be minimised, especially in obstetric imaging."],
    ["What does harmonic imaging exploit?","Higher harmonics generated within tissue",["The Doppler frequency shift arising from moving red cells","Reflection at the skin surface only","The transmit echoes alone"],"It reduces near-field clutter and improves contrast."],
    ["What is elastography used to assess?","The stiffness of a tissue or lesion",["The blood flow velocity within a vessel","The depth of a fluid collection","The acoustic output of the probe"],"Stiffer tissue is more suspicious for malignancy or fibrosis."],
    ["What do microbubble contrast agents do?","Strongly reflect sound to show perfusion",["Absorb the beam completely to create a dark shadow","Shorten the tissue relaxation time","Emit their own gamma photons"],"They resonate in the beam and enhance vascular signal."],
    ["What is B-mode ultrasound?","A two-dimensional grey-scale image",["A single-line depth trace over time","A colour map of blood flow","A spectral velocity waveform"],"Brightness encodes the amplitude of each returning echo."],
    ["What is M-mode ultrasound used for?","Tracking motion of a structure over time",["Building a full three-dimensional volumetric data set","Mapping flow direction in colour","Measuring tissue stiffness"],"It gives excellent temporal resolution, as for heart valves."],
    ["What does spectral Doppler display?","Velocity plotted against time",["A grey-scale map of tissue anatomy","The stiffness distribution of a mass","The attenuation profile with depth"],"The waveform shape reflects the vascular resistance downstream."],
    ["What causes the ring-down artefact?","Resonating gas bubbles behind a reflector",["Total shadowing occurring behind a large calcified stone","Refraction at the edge of a cyst","Aliasing at high velocities"],"It appears as a solid bright streak deep to gas collections."],
    ["What limits the frame rate in ultrasound?","Depth, sector width and line density",["The transmit frequency of the crystal alone","The coupling gel viscosity","The dynamic range setting"],"Deeper imaging over a wide sector slows the frame rate."],
    ["Why does colour Doppler reduce the frame rate?","Multiple pulses are needed per scan line",["The transmit power must be halved for every scan line","The probe overheats and slows down","Gel absorbs part of the beam"],"Estimating flow requires several samples along each line."],
    ["What is the main safety concern in obstetric Doppler?","Thermal heating of developing tissue",["Ionising radiation dose delivered to the developing fetus","Nephrotoxicity from a contrast agent","Projectile risk near the magnet"],"Spectral Doppler concentrates energy and is used sparingly early on."],
    ["What is edge, or refraction, shadowing?","A thin shadow at a curved boundary",["A bright band deep to a simple cyst","Reverberation between two reflectors","A colour Doppler aliasing band"],"It occurs at the edges of round structures like the gallbladder."],
    ["What does the dynamic range setting control?","The range of echo amplitudes displayed",["The physical depth of the scan field being displayed","The Doppler pulse repetition frequency","The mechanical index"],"A wide range gives a smoother, greyer image."],
    ["Why can ultrasound not image through bowel gas well?","Gas reflects almost all the sound",["Bone absorbs the entire returning echo","Fluid refracts the beam away","Muscle attenuates it completely"],"The huge impedance mismatch at gas blocks deeper imaging."],
    ["What is a side-lobe artefact?","Echoes from off-axis beam energy",["A dense acoustic shadow cast behind a large stone","Reverberation deep to metal","Enhancement behind a cyst"],"It can place spurious echoes inside fluid-filled structures."],
    ["Why is the liver a good acoustic window?","It is homogeneous and free of gas",["It strongly reflects the entire beam","It contains air that boosts contrast","It has a very high impedance"],"It lets the beam reach deeper structures like the kidney."],
    ["What does increasing the number of focal zones do?","Improves lateral resolution but lowers frame rate",["Raises the display frame rate at every imaging depth","Removes reverberation artefact fully","Increases penetration directly"],"Each focal zone needs its own transmit pulse."]
  ],
  msk: [
    ["Which fracture involves the distal radius dorsally angulated?","A Colles fracture",["A Smith fracture, which angulates the other way","A Barton fracture-dislocation","A Galeazzi fracture"],"A Smith fracture is the volar-angulated reverse pattern."],
    ["What is a Smith fracture?","A volarly angulated distal radius fracture",["A dorsally angulated distal radius fracture","A radial head fracture in the elbow","A scaphoid waist fracture"],"It is sometimes called a reverse Colles fracture."],
    ["Which carpal bone is most commonly fractured?","The scaphoid",["The lunate, which dislocates more than it fractures","The triquetrum","The pisiform"],"Its blood supply runs distal to proximal, risking avascular necrosis."],
    ["Why is a scaphoid waist fracture prone to non-union?","Its blood supply enters distally",["The bone is far too small to be immobilised","It is always comminuted at the waist","It never bears any mechanical load"],"The proximal pole can undergo avascular necrosis."],
    ["What is a Monteggia fracture-dislocation?","Ulnar fracture with radial head dislocation",["Radial fracture with distal ulnar dislocation","Isolated fracture of both forearm bones","A distal radius fracture with carpal injury"],"A Galeazzi injury is the mirror pattern at the wrist."],
    ["What is a Galeazzi fracture?","Radial shaft fracture with distal ulnar dislocation",["An ulnar shaft fracture with dislocation of the radial head","A midshaft fracture of both bones","A fracture confined to the radial head"],"It disrupts the distal radioulnar joint."],
    ["What does the anterior humeral line normally intersect?","The middle third of the capitellum",["The posterior third of the radial head","The olecranon fossa directly","The medial epicondyle apophysis"],"Displacement suggests a supracondylar fracture in children."],
    ["What does a visible posterior fat pad at the elbow imply?","An occult intra-articular fracture",["A completely normal paediatric elbow joint","A soft-tissue contusion only","A chronic joint effusion alone"],"The posterior fat pad is always abnormal when seen."],
    ["Which sign indicates a lipohaemarthrosis of the knee?","A fat-fluid level on a horizontal-beam film",["Diffuse soft-tissue swelling with no discernible fluid level","A joint free of any effusion","Chondrocalcinosis in the menisci"],"It implies an intra-articular fracture releasing marrow fat."],
    ["What is a Segond fracture associated with?","Anterior cruciate ligament rupture",["An isolated tear of the medial meniscus","A posterior cruciate avulsion","A patellar tendon rupture"],"It is a small avulsion off the lateral tibial plateau."],
    ["A reverse Segond fracture is associated with which injury?","Posterior cruciate ligament injury",["An anterior cruciate ligament tear alone","A lateral collateral ligament sprain","An isolated meniscal tear"],"It avulses the medial tibial plateau instead."],
    ["What is a Maisonneuve fracture?","Proximal fibular fracture with ankle injury",["An isolated fracture of the medial malleolus","A distal fibular fracture in isolation","A calcaneal fracture from a fall"],"The syndesmosis and medial structures are disrupted."],
    ["What angle assesses depressed calcaneal fractures?","Bohler's angle",["The Wiberg centre-edge angle of the hip","The scapholunate angle of the wrist","The lateral talar dome angle"],"A reduced Bohler's angle indicates depression of the calcaneus."],
    ["What is a Lisfranc injury?","Disruption of the tarsometatarsal joints",["A fracture confined solely to the calcaneus","A dislocation of the subtalar joint","An avulsion of the fifth metatarsal base"],"Malalignment of the second metatarsal base is a key sign."],
    ["A Jones fracture affects which bone?","The base of the fifth metatarsal",["The neck of the second metatarsal bone","The proximal phalanx of the hallux","The navicular bone of the midfoot"],"It occurs at the metaphyseal-diaphyseal junction and heals poorly."],
    ["What does the 'terrible triad' of the elbow include?","Radial head, coronoid and posterior dislocation",["Fractures of both the epicondyles and the olecranon tip","The capitellum, trochlea and radial neck","Three separate carpal fractures"],"It is a highly unstable elbow injury pattern."],
    ["Which shoulder dislocation is most common?","Anterior dislocation",["Posterior dislocation, seen after a seizure","Inferior luxatio erecta dislocation","A pure superior dislocation"],"Around 95% of shoulder dislocations are anterior."],
    ["What imaging sign suggests posterior shoulder dislocation?","The light-bulb sign on the frontal view",["A widened acromiohumeral distance overall","An empty glenoid fossa entirely","A Hill-Sachs lesion anteriorly"],"Internal rotation makes the humeral head look like a light bulb."],
    ["What is a Hill-Sachs lesion?","A posterolateral humeral head impaction",["An avulsion of the anterior inferior glenoid labral rim","A fracture of the greater tuberosity","A rotator cuff tendon tear"],"A Bankart lesion is its anterior glenoid counterpart."],
    ["What is a Bankart lesion?","An anteroinferior glenoid labral injury",["A posterolateral impaction defect of the humeral head","A superior labral tear front to back","A biceps tendon rupture"],"A bony Bankart involves the glenoid rim fracture."],
    ["What is a SLAP lesion?","A superior labral tear anterior to posterior",["An inferior labral avulsion occurring at the glenoid rim","A full-thickness supraspinatus tear","A subscapularis tendon tear"],"It involves the biceps anchor at the superior labrum."],
    ["What does chondrocalcinosis on radiographs suggest?","Calcium pyrophosphate deposition disease",["Acute gout caused by monosodium urate crystal deposition","Rheumatoid pannus formation","Septic arthritis of the joint"],"Cartilage calcification is typical, as in the knee menisci."],
    ["Which erosion pattern is typical of rheumatoid arthritis?","Marginal erosions with periarticular osteopenia",["Well-defined erosions with overhanging sclerotic edges","Dense sclerosis with large new bone spurs","Fluffy periosteal reaction along shafts"],"Overhanging edges instead suggest gout."],
    ["What is the classic radiographic feature of gout?","Erosions with sclerotic overhanging margins",["Symmetric marginal erosions of both wrists with osteopenia","Uniform joint space loss with osteopenia","A bamboo spine appearance"],"Preserved joint space and tophi are also typical."],
    ["Which imaging feature defines ankylosing spondylitis late?","A bamboo spine from bridging syndesmophytes",["Random asymmetric large marginal osteophytes","Marginal erosions of the small hand joints","Chondrocalcinosis of both knees"],"Sacroiliitis is usually the earliest change."],
    ["What is Codman's triangle a sign of?","Aggressive periosteal reaction, often malignant",["A benign non-ossifying fibroma of the long bone cortex","A simple healing fracture callus","A normal growth plate variant"],"It is seen with osteosarcoma and Ewing sarcoma."],
    ["What periosteal pattern suggests Ewing sarcoma?","An onion-skin lamellated reaction",["A solid, smooth, uniform periosteal shell","A thin sclerotic rim around a lucency","No periosteal reaction whatsoever"],"A permeative diaphyseal lesion in a child is typical."],
    ["Which bone tumour classically shows a 'sunburst' pattern?","Osteosarcoma",["An enchondroma of the phalanx","A simple unicameral bone cyst","A benign giant cell tumour"],"Spiculated periosteal new bone radiates outward."],
    ["Where does a giant cell tumour typically arise?","At the epiphysis, extending to subarticular bone",["Within the diaphysis of a long bone shaft, sparing the ends","Within the medullary metaphysis only","In the flat bones of the skull"],"It is eccentric and lytic, classically around the knee."],
    ["What characterises an osteoid osteoma?","A lucent nidus with surrounding sclerosis",["A purely lytic lesion with no sclerosis","A densely sclerotic lesion with no lucency","A large multiloculated expansile lesion"],"Night pain relieved by aspirin is characteristic."],
    ["Which feature suggests a benign rather than aggressive lesion?","A narrow zone of transition",["A wide, ill-defined zone of transition","Cortical destruction with a soft-tissue mass","A permeative moth-eaten pattern"],"A sclerotic rim also favours a benign process."],
    ["What is the 'fallen fragment' sign associated with?","A simple bone cyst with a pathological fracture",["An aneurysmal bone cyst containing multiple fluid-fluid levels","A giant cell tumour at the epiphysis","A metastatic deposit in the marrow"],"A fragment of cortex falls into the fluid-filled cyst."],
    ["What imaging feature characterises an aneurysmal bone cyst?","Fluid-fluid levels on cross-sectional imaging",["A single fallen bony fragment lying within the fluid cavity","A sunburst periosteal reaction","A central sequestrum of dead bone"],"It is an expansile, blood-filled lesion."],
    ["What is a sequestrum in osteomyelitis?","A fragment of dead, sclerotic bone",["A shell of new periosteal bone","A tract draining to the skin surface","A soft-tissue abscess collection"],"The surrounding involucrum is the new bone shell."],
    ["What does the Terry Thomas sign indicate?","Scapholunate dissociation at the wrist",["A perilunate dislocation without any scapholunate widening","A distal radioulnar joint disruption","A triquetral avulsion fracture"],"A widened scapholunate gap resembles the gap-toothed actor."],
    ["What indicates avascular necrosis of the femoral head?","Subchondral lucency and later collapse",["Uniform diffuse osteopenia of the pelvis","Marginal erosions of the acetabulum","Chondrocalcinosis of the joint"],"The crescent sign marks subchondral fracture."],
    ["Which stress fracture site is at high risk of progression?","The anterior tibial cortex",["The posteromedial tibial cortex","The second metatarsal shaft","The calcaneal body"],"The 'dreaded black line' can go to complete fracture."],
    ["What defines a pathological fracture?","A fracture through abnormal, weakened bone",["Any comminuted fracture resulting from a high-energy impact","A fracture that fails to heal in time","A fracture crossing a growth plate"],"Underlying causes include metastases and cysts."],
    ["Which primary tumours most commonly spread to bone?","Breast, prostate, lung, kidney and thyroid",["Only the brain and the spinal cord, and nothing else at all","Skin melanoma exclusively and alone","The pancreas and the liver alone"],"Prostate deposits are classically sclerotic."],
    ["What is myositis ossificans?","Heterotopic bone forming in soft tissue",["An aggressive malignant soft-tissue sarcoma of the muscle","Calcification within an artery wall","A chronic muscle tear with atrophy"],"A peripheral rim of mature ossification is reassuring."],
    ["What is the Salter-Harris classification used for?","Grading paediatric growth plate fractures",["Staging bone tumours by aggressiveness","Grading rotator cuff tendon tears","Classifying adult intra-articular fractures"],"Type II, through the metaphysis, is the most common."]
  ],
  spi: [
    ["What is a Jefferson fracture?","A burst fracture of the C1 ring",["An odontoid peg fracture of C2","A hangman's fracture through the pars","A teardrop fracture of the lower cervical spine"],"It results from axial loading onto the vertex."],
    ["What is a hangman's fracture?","Bilateral C2 pars interarticularis fracture",["A fracture running through the base of the odontoid peg itself","A C1 anterior and posterior arch fracture","A unilateral facet dislocation"],"It is caused by hyperextension and distraction."],
    ["Which odontoid fracture type is most prone to non-union?","A type II fracture through the base",["A type III fracture extending down into the vertebral body","A type I fracture of the tip","A stable avulsion of the tip alone"],"Its narrow blood supply impairs healing."],
    ["What does the atlanto-dental interval measure?","The gap between the dens and C1 arch",["The overall width of the spinal canal at the level of C1","The height of the C2 body","The angle of the odontoid peg"],"Widening suggests transverse ligament rupture."],
    ["What is a Chance fracture?","A horizontal fracture through the vertebra",["A compression fracture of the endplate only","A unilateral facet joint dislocation","An isolated spinous process avulsion"],"It is a flexion-distraction injury linked to seat belts."],
    ["Why is a Chance fracture clinically important?","It is linked to intra-abdominal injury",["It never involves the posterior elements","It is always a stable minor injury","It only occurs in the cervical spine"],"Bowel and mesenteric injuries commonly accompany it."],
    ["What defines an unstable spinal injury on imaging?","Disruption of two or more columns",["Any wedge loss of vertebral height","A single transverse process fracture","An isolated endplate irregularity"],"The Denis three-column concept guides this assessment."],
    ["What is spondylolysis?","A defect in the pars interarticularis",["Forward slip of one vertebra on another","Fusion of adjacent vertebral bodies","Narrowing of the central canal"],"On oblique films it gives the Scottie dog collar sign."],
    ["What is spondylolisthesis?","Forward slip of one vertebra over another",["A defect in the pars interarticularis without any actual slip","Backward tilting of the sacrum alone","Widening of the disc space"],"The Meyerding system grades its severity."],
    ["Which grading system stages spondylolisthesis?","The Meyerding classification",["The Denis three-column system","The Frankel neurological scale","The Modic endplate classification"],"It divides the slip into quarters of the vertebral width."],
    ["What do Modic changes describe?","Vertebral endplate and marrow signal change",["Disc material herniating backward into the central spinal canal","Facet joint arthropathy severity","Cord signal change from compression"],"Type 1 is oedematous and type 2 is fatty."],
    ["What is the difference between disc protrusion and extrusion?","Extrusion's base is narrower than its dome",["A protrusion invariably compresses the cord and the nerve roots","Extrusion is confined by the annulus","Protrusion is a free fragment"],"A sequestered fragment has lost continuity with the disc."],
    ["What is a sequestrated disc fragment?","A free fragment separated from the disc",["A broad disc bulge contained entirely within the annulus fibrosus","A calcified osteophyte at the endplate","A normal age-related disc change"],"It may migrate within the epidural space."],
    ["What is the conus medullaris?","The tapering caudal end of the cord",["The bundle of nerve roots below the cord","The dural sac termination point","The filum terminale attachment"],"It usually lies at about the L1 level in adults."],
    ["What is the cauda equina?","The nerve roots below the spinal cord",["The tapered end of the spinal cord itself","The ligament anchoring the cord to the sacrum","The venous plexus around the cord"],"Compression here is a surgical emergency."],
    ["What imaging finding suggests cauda equina compression?","A large central disc compressing the roots",["An isolated far-lateral disc protrusion affecting one exiting root","A single-level facet arthropathy","A small Schmorl node in the endplate"],"Urgent MRI is required with sphincter symptoms."],
    ["What is a Schmorl node?","Disc herniation through a vertebral endplate",["A posterior disc bulge protruding into the central spinal canal","A synovial cyst of the facet joint","An osteophyte bridging two vertebrae"],"It is usually an incidental, benign finding."],
    ["What does DISH stand for on spinal imaging?","Diffuse idiopathic skeletal hyperostosis",["Degenerative intervertebral spinal herniation","Disc-induced spinal hyperlordosis","Distal intraspinal soft-tissue haematoma"],"Flowing ossification bridges four contiguous vertebrae."],
    ["How does DISH differ from ankylosing spondylitis?","It spares the sacroiliac joints",["It always fuses the sacroiliac joints","It causes marginal syndesmophytes only","It never bridges vertebral bodies"],"Its ossification is thick and flowing on the right."],
    ["What is the classic MRI feature of spinal cord infarction?","T2 hyperintensity in an anterior distribution",["Avid enhancement of the entire cord cross-section after contrast","A discrete enhancing intradural mass","Uniform cord expansion without signal"],"An 'owl eye' pattern of anterior horns may be seen."],
    ["What is syringomyelia?","A fluid-filled cavity within the cord",["Inflammation of the surrounding meninges","A tumour arising from the nerve roots","Compression of the cord by an osteophyte"],"It is often associated with a Chiari malformation."],
    ["What is a Chiari I malformation?","Cerebellar tonsils descending below the foramen",["A large posterior fossa cyst displacing the vermis","Herniation of the medulla into the canal","Absence of the cerebellar vermis"],"Tonsillar descent beyond 5 mm is significant."],
    ["Which tumour is the commonest intramedullary one in adults?","Ependymoma",["Meningioma of the thecal sac","Schwannoma of a nerve root","Metastatic epidural deposit"],"It often arises in the conus or filum region."],
    ["Where do spinal meningiomas typically lie?","Intradural but extramedullary",["Within the cord substance itself","In the epidural space outside the dura","Within the vertebral body marrow"],"They are commonest in the thoracic spine of women."],
    ["What is a dumbbell tumour of the spine?","A nerve sheath tumour through the foramen",["A meningioma confined entirely within the dura of the thecal sac","A metastasis in the vertebral body","A disc fragment in the lateral recess"],"Schwannomas classically extend through the neural exit."],
    ["Which malignancy most often causes epidural cord compression?","Metastatic disease of the vertebrae",["A primary spinal cord glioma arising within the cord substance","A benign nerve sheath tumour","An intradural meningioma"],"Breast, lung and prostate primaries predominate."],

    ["What differentiates small from large bowel on a film?","Valvulae conniventes cross the full width",["Haustral folds that always cross the entire width of the lumen","Small bowel is peripheral in position","Large bowel lacks any markings"],"Haustra only partially cross the large bowel."],

    ["What is the normal CSF pathway from the third ventricle?","Through the cerebral aqueduct to the fourth",["Directly upward and outward into both of the lateral ventricles","Straight into the cisterna magna","Backwards through the foramen of Monro"],"It then exits via the foramina of Luschka and Magendie."],
