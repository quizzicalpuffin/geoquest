  .badge {

  .grouphdr { font-weight:800; font-size:1.05rem; margin:16px 0 8px; padding-bottom:5px; border-bottom:2px solid rgba(255,255,255,.3); opacity:.95; }

  sph: [
   ["What is a core principle of teaching personal safety to children?","Their body belongs to them, and they can always tell a trusted adult",["That they must keep adults' secrets","That some touches must be hidden","That feelings don't matter"],"Empowering, non-fearful messaging helps children speak up early."],
   ["Which is a recognised warning sign of grooming?","Building secrecy and isolating a child from others",["Encouraging open family contact","Respecting boundaries","Involving parents"],"Grooming often involves secrecy, gifts and boundary-testing — trust your instincts and seek help."],
   ["What is the safest response if a child discloses abuse to you?","Stay calm, believe them, reassure them it's not their fault, and report it",["Promise to keep it secret","Interrogate them for details","Confront the alleged abuser yourself"],"Listen, reassure, and contact the appropriate child-protection services."],
   ["'Coercive control' in a relationship refers to?","A pattern of intimidation and control that removes freedom",["A single argument","Healthy compromise","Spending time apart"],"It's now recognised in law in Ireland and the UK as a form of abuse."],
   ["What does 'consent' require to be valid?","It must be freely given, informed, and reversible",["Silence","Assuming yes","A one-time agreement forever"],"Consent can be withdrawn at any time — respecting that is essential."],
   ["Bystander intervention programmes teach people to?","Safely notice, and act to prevent harm",["Ignore warning signs","Record incidents for fun","Blame the victim"],"Even small safe actions — a distraction or getting help — can prevent harm."],
   ["A protective factor for a child's resilience is?","At least one stable, caring, trusted adult relationship",["Complete isolation","Constant criticism","Keeping all feelings hidden"],"Research consistently shows one trusted adult makes an enormous difference."],
   ["In Ireland, mandated persons have a legal duty to do what regarding child protection concerns?","Report reasonable concerns to Tusla",["Investigate alone","Stay silent","Wait for proof"],"'Children First' legislation guides safeguarding in Ireland."],
   ["Healthy conflict resolution in relationships involves?","Listening, respect, and no threats or intimidation",["Shouting to win","Silent punishment","Controlling the other person"],"Disagreement is normal; fear and control are not."],
   ["A trauma-informed response to someone who has been harmed prioritises?","Safety, trust, and giving them choice and control",["Rushing them","Demanding details","Minimising their experience"],"Feeling in control again is a key part of recovery."],
   ["Talking with children about online safety is most effective when it is?","Ongoing, age-appropriate and judgement-free",["A single scary lecture","Never discussed","Based only on bans"],"Regular, calm conversations keep the door open for kids to disclose worries."],
   ["If you or someone you know needs support around abuse or safety, a good step is to?","Contact a trusted professional or a dedicated helpline",["Do nothing","Keep it entirely secret","Assume it will pass"],"Reaching out for support is a sign of strength — help is available."],
   ["What is the best first response if a child discloses abuse?","Stay calm, listen, believe them, reassure them it's not their fault, and report it",["Promise total secrecy","Interrogate them for details","Confront the alleged abuser yourself"],"Then contact the appropriate child-protection services."],
   ["Which of these is a recognised warning sign of grooming?","Secrecy, gifts and isolating a child from others",["Encouraging family time","Respecting boundaries","Involving parents openly"],"Trust your instincts and seek advice."],
   ["What does 'safeguarding' mean?","Protecting children's health, wellbeing and rights",["Locking all the doors","A type of insurance","A school subject"],"It's everyone's responsibility."],
   ["Why is it valuable for a child to have more than one trusted adult?","So there's always someone safe to turn to",["To confuse them","For no reason","To reduce their friendships"],"Research shows one trusted adult makes a huge difference — more is even better!"],

   ["What is 'consent education' for young people mainly about?","Understanding respect, boundaries and the right to say no",["Winning arguments","Always following orders","Keeping secrets"],"It builds safe, respectful relationships."],
   ["If you're worried about a child but unsure what to do, a good step is to?","Seek advice from a professional or a dedicated helpline",["Do nothing","Wait for definite proof","Keep it to yourself"],"You don't need to be certain to reach out for guidance."],
   ["Who is a 'trusted adult'?","A grown-up who keeps you safe, like a parent or teacher",["A stranger online","Anyone at all","Only famous people"],"You can always go to them if you feel worried!"],
   ["If someone is bullying you, what should you do?","Tell a trusted adult",["Keep it a secret","Cry alone","Bully them back"],"Telling is brave and smart!"],

   ["What's the difference between a good surprise and a bad secret?","A surprise is happy and gets told; a bad secret should never be kept",["They are exactly the same","Both must be hidden forever","Neither one matters"],"If a secret makes you feel bad, tell a trusted adult!"],

   ["What should you do if you see someone being bullied?","Be kind to them and tell a trusted adult",["Laugh along","Join in","Walk away and say nothing"],"You can be an 'upstander'!"],

   ["If a friend tells you they are being hurt, you should?","Believe them and help them tell a trusted adult",["Keep it totally secret","Tell everyone at school","Ignore it"],"You just have to help them reach help!"],
   ["Why is asking for help a sign of strength?","Because everyone needs support sometimes",["Because it's weak","It never helps","Only little kids do it"],"Reaching out is brave!"],

const LEVELS = { 1:{name:"Explorer",emoji:"🐣",sub:"Ages 5–7"}, 2:{name:"Adventurer",emoji:"🚀",sub:"Ages 8–10"}, 3:{name:"Expert",emoji:"🧠",sub:"Ages 11+"}, 4:{name:"Mastermind",emoji:"🎓",sub:"Adults"} };
const CATS = { cap:{name:"Capitals",emoji:"🏛️"}, flag:{name:"Flags",emoji:"🚩"}, pop:{name:"People",emoji:"👨‍👩‍👧‍👦"}, mtn:{name:"Mountains",emoji:"⛰️"}, riv:{name:"Rivers",emoji:"🌊"}, oce:{name:"Oceans & Seas",emoji:"🐳"}, con:{name:"Continents",emoji:"🗺️"}, lmk:{name:"Landmarks",emoji:"🗽"}, eur:{name:"Europe",emoji:"🏰"}, irl:{name:"Ireland",emoji:"☘️"}, sli:{name:"Sligo",emoji:"🌄"}, spt:{name:"Football",emoji:"⚽"}, rug:{name:"Rugby",emoji:"🏉"}, gaa:{name:"Gaelic Football",emoji:"🥅"}, ai:{name:"AI & Robots",emoji:"🤖"}, srf:{name:"Surfing",emoji:"🏄"}, glf:{name:"Golf",emoji:"⛳"}, his:{name:"Irish History",emoji:"📜"}, art:{name:"Art",emoji:"🎨"}, isc:{name:"Irish Soccer",emoji:"🇮🇪"}, esc:{name:"English Soccer",emoji:"🏴󠁧󠁢󠁥󠁮󠁧󠁿"}, euf:{name:"European Soccer",emoji:"🏆"}, wsc:{name:"World Soccer",emoji:"🌍"}, ehi:{name:"European History",emoji:"⚔️"}, dis:{name:"Disgusting History",emoji:"🤢"}, sci:{name:"Science",emoji:"🔬"}, cyb:{name:"Cyber & Digital Health",emoji:"🔒"}, sph:{name:"Safety & Wellbeing",emoji:"💚"}, lif:{name:"Life Science",emoji:"🌱"}, ear:{name:"Earth Science",emoji:"🌋"}, spc:{name:"Space Science",emoji:"🚀"}, ani:{name:"Animals",emoji:"🦁"}, din:{name:"Dinosaurs",emoji:"🦕"}, myt:{name:"Myths & Legends",emoji:"🐉"}, mus:{name:"Music",emoji:"🎵"}, mov:{name:"Movies & TV",emoji:"🎬"}, gam:{name:"Gaming",emoji:"🎮"}, frt:{name:"Fortnite",emoji:"🪂"}, sw:{name:"Star Wars",emoji:"🌌"}, hp:{name:"Harry Potter",emoji:"⚡"}, lotr:{name:"Lord of the Rings",emoji:"💍"}, mvl:{name:"Marvel",emoji:"🦸"}, col:{name:"Collectibles",emoji:"🃏"}, mix:{name:"Mix It Up!",emoji:"🎲"} };
const GROUPS = [
  {name:"🔬 Science & Geography", cats:["cap","flag","pop","mtn","riv","oce","con","lmk","eur","irl","sli","sci","lif","ear","spc","ani","din"]},
  {name:"⚽ Sport", cats:["spt","rug","gaa","srf","glf","isc","esc","euf","wsc"]},
  {name:"🌟 Fandom & Collectibles", cats:["sw","hp","lotr","mvl","col"]},
  {name:"🎨 Other Fun Stuff", cats:["his","ehi","dis","art","myt","mus","mov","gam","frt","ai","cyb","sph"]}
];
const AVATARS = ["🦁","🐼","🦊","🐸","🦄","🐯","🐨","🐙"];
const BADGES = [
  {id:"first",   i:"🌟", n:"First Star",     d:"Get your first answer right"},
  {id:"streak5", i:"🔥", n:"On Fire",        d:"5 correct in a row"},
  {id:"streak10",i:"⚡", n:"Unstoppable",    d:"10 correct in a row"},
  {id:"perfect", i:"🏅", n:"Perfect Round",  d:"Get every question right in a round"},
  {id:"pts100",  i:"💯", n:"Century Club",   d:"Earn 100 points"},
  {id:"pts500",  i:"🏆", n:"Globe Trotter",  d:"Earn 500 points"},
  {id:"pts1000", i:"👑", n:"Geo Champion",   d:"Earn 1,000 points"},
  {id:"allcats", i:"🧭", n:"World Explorer", d:"Play every category"},
  {id:"expertperfect", i:"🎓", n:"Brainiac", d:"Perfect round on Expert level"}
];
const ROUND_LEN = 8;

/* ================= STORAGE ================= */
let memStore = {};
function save(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){ memStore[k]=v; } }
function load(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return memStore[k]!==undefined?memStore[k]:d; } }

let profiles = load("gq_profiles", []);
let curP = null; // index into profiles

/* ================= AUDIO ================= */
let audioCtx=null, soundOn = load("gq_sound", true);
function beep(freqs, dur){
  if(!soundOn) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    freqs.forEach((f,i)=>{
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type="sine"; o.frequency.value=f; o.connect(g); g.connect(audioCtx.destination);
      const t=audioCtx.currentTime + i*dur;
      g.gain.setValueAtTime(0.15,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
      o.start(t); o.stop(t+dur);
    });
  }catch(e){}
}
const sndRight=()=>beep([523,659,784],0.12), sndWrong=()=>beep([220,180],0.18), sndBadge=()=>beep([523,659,784,1047],0.11);

/* ================= HELPERS ================= */
const $ = s=>document.querySelector(s);
const app = document.getElementById("app");
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function confetti(){
  const chars=["🎉","⭐","🌍","✨","🎈"];
  for(let i=0;i<18;i++){
    const el=document.createElement("div");
    el.className="confetti"; el.textContent=chars[Math.floor(Math.random()*chars.length)];
    el.style.left=Math.random()*95+"vw";
    el.style.animationDuration=(1.2+Math.random()*1.5)+"s";
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),3000);
  }
}
function isFlagEmoji(s){ return /^[\u{1F1E6}-\u{1F1FF}]{2}$/u.test(s); }

/* ================= PROFILE SCREENS ================= */
function screenProfiles(){
  let html = `<h1>🌍 GeoQuest</h1><p class="sub">The world quiz for explorers!</p><div class="card profile-list"><h2>Who's playing?</h2>`;
  profiles.forEach((p,i)=>{
    html += `<button class="btn" onclick="pickProfile(${i})"><span class="av">${p.avatar}</span> ${esc(p.name)} <span class="pts">⭐ ${p.points}</span></button>`;
  });
  html += `<button class="btn primary center" onclick="screenNewProfile()">➕ New Explorer</button></div>
  <div class="footerlink">v26 · complete · 4,280 questions · Tip: in Safari tap Share → “Add to Home Screen” to make this an app!</div>`;
  app.innerHTML = html;
}
function screenNewProfile(){
  let selAv = AVATARS[0];
  app.innerHTML = `<h1>🌍 GeoQuest</h1><div class="card"><h2>Pick your explorer!</h2>
    <div class="avatars" id="avs">${AVATARS.map(a=>`<button data-a="${a}" class="${a===selAv?'sel':''}">${a}</button>`).join("")}</div>
    <input type="text" id="pname" maxlength="12" placeholder="Type your name">
    <button class="btn primary center" id="mkbtn">Let's Go! 🚀</button>
    <button class="btn ghost center" onclick="screenProfiles()">Back</button></div>`;
  $("#avs").addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b) return;
    selAv=b.dataset.a;
    document.querySelectorAll("#avs button").forEach(x=>x.classList.toggle("sel",x===b));
  });
  $("#mkbtn").addEventListener("click",()=>{
    const name=$("#pname").value.trim()||"Explorer";
    profiles.push({name, avatar:selAv, points:0, bestStreak:0, badges:[], cats:[], correct:0});
    save("gq_profiles",profiles);
    curP=profiles.length-1;
    screenHome();
  });
}
function pickProfile(i){ curP=i; screenHome(); }

/* ================= HOME ================= */
let sel = { level: load("gq_level",1), cat:"mix" };
function screenHome(){
  const p=profiles[curP];
  let html = `
  <div class="topbar"><span class="pill">${p.avatar} ${esc(p.name)}</span><span class="pill">⭐ ${p.points} pts</span></div>
  <div class="card"><h2>Choose your level</h2>
    ${Object.entries(LEVELS).map(([k,l])=>`<button class="btn ${sel.level==k?'primary':''}" onclick="setLevel(${k})">${l.emoji} ${l.name} <small style="opacity:.7;font-weight:600"> · ${l.sub}</small></button>`).join("")}
  </div>
  <div class="card"><h2>Pick a topic</h2>
    <button class="btn primary" onclick="startRound('mix')">🎲 Mix It Up! <small style="opacity:.7;font-weight:600"> · all topics</small></button>
    ${GROUPS.map(g=>`<div class="grouphdr">${g.name}</div>`+g.cats.filter(k=>CATS[k]).map(k=>`<button class="btn" onclick="startRound('${k}')">${CATS[k].emoji} ${CATS[k].name}</button>`).join("")).join("")}
  </div>
  <div class="row">
    <button class="btn ghost center" onclick="screenBadges()">🏅 Badges</button>
    <button class="btn ghost center" onclick="toggleSound()">${soundOn?"🔊 Sound On":"🔇 Sound Off"}</button>
    <button class="btn ghost center" onclick="screenProfiles()">👥 Switch</button>
  </div>`;
  app.innerHTML=html;
}
function setLevel(l){ sel.level=l; save("gq_level",l); screenHome(); }
function toggleSound(){ soundOn=!soundOn; save("gq_sound",soundOn); screenHome(); }

/* ================= BADGES ================= */
function screenBadges(){
  const p=profiles[curP];
  app.innerHTML = `<h1>🏅 Badges</h1><p class="sub">${p.avatar} ${esc(p.name)} — best streak: ${p.bestStreak} 🔥</p>
  <div class="card"><div class="badges">
    ${BADGES.map(b=>`<div class="badge ${p.badges.includes(b.id)?'':'locked'}"><div class="i">${b.i}</div><div class="n">${b.n}</div><div class="n" style="opacity:.7;font-weight:500">${b.d}</div></div>`).join("")}
  </div></div>
  <button class="btn primary center" onclick="screenHome()">Back to Quiz 🌍</button>`;
}

/* ================= QUIZ ================= */
let round=null;
function startRound(cat){
  sel.cat=cat;
  const bank = cat==="mix"
    ? shuffle([].concat(...Object.values(DATA[sel.level])))
    : shuffle(DATA[sel.level][cat]);
  round = { qs: bank.slice(0,ROUND_LEN), i:0, correct:0, streak:0, gained:0, newBadges:[] };
  showQuestion();
}
function showQuestion(){
  const p=profiles[curP], q=round.qs[round.i];
  const opts = shuffle([q[1],...q[2]]);
  const flagOpts = opts.every(isFlagEmoji);
  const streakTxt = round.streak>=3 ? `🔥 ${round.streak} in a row! Bonus points on!` : (round.streak>0?`🔥 Streak: ${round.streak}`:"");
  app.innerHTML = `
  <div class="topbar"><span class="pill">${CATS[sel.cat].emoji} ${CATS[sel.cat].name}</span><span class="pill">⭐ ${p.points+round.gained}</span></div>
  <div class="progress"><div style="width:${(round.i/ROUND_LEN)*100}%"></div></div>
  <div class="qnum">Question ${round.i+1} of ${ROUND_LEN}</div>
  <div class="streakflame">${streakTxt}</div>
  <div class="card">
    <div class="question">${esc(q[0])}</div>
    <div id="opts">${opts.map(o=>`<button class="btn center" style="${flagOpts?'font-size:2.6rem;padding:10px':''}" data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div>
    <div id="after"></div>
  </div>`;
  $("#opts").addEventListener("click", e=>{
    const b=e.target.closest("button"); if(!b||round.answered) return;
    answer(b, b.dataset.o===q[1], q);
  });
}
function answer(btn, right, q){
  round.answered=true;
  const p=profiles[curP];
  document.querySelectorAll("#opts .btn").forEach(b=>{
    b.disabled=true;
    if(b.dataset.o===q[1]) b.classList.add("correct","bounce");
    else if(b===btn && !right) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  let msg;
  if(right){
    round.correct++; round.streak++;
    const bonus = round.streak>=3?5:0;
    round.gained += 10+bonus;
    p.correct++;
    if(round.streak>p.bestStreak) p.bestStreak=round.streak;
    msg = `<b>Correct! +${10+bonus} points${bonus?" (streak bonus!)":""}</b> 🎉`;
    sndRight(); confetti();
    grantIf("first", p.correct>=1);
    grantIf("streak5", round.streak>=5);
    grantIf("streak10", round.streak>=10);
  } else {
    round.streak=0;
    msg = `<b>Not quite!</b> The answer is <b>${esc(q[1])}</b>.`;
    sndWrong();
  }
  $("#after").innerHTML = `<div class="fact">${msg}<br><br>💡 <b>Fun fact:</b> ${esc(q[3])}</div>
    <button class="btn primary center" onclick="next()">${round.i+1<ROUND_LEN?"Next Question ➡️":"See My Score 🏁"}</button>`;
}
function next(){
  round.answered=false; round.i++;
  if(round.i<ROUND_LEN) showQuestion(); else finishRound();
}
function grantIf(id, cond){
  const p=profiles[curP];
  if(cond && !p.badges.includes(id)){ p.badges.push(id); round.newBadges.push(id); sndBadge(); }
}
function finishRound(){
  const p=profiles[curP];
  p.points += round.gained;
  if(!p.cats.includes(sel.cat) && sel.cat!=="mix") p.cats.push(sel.cat);
  grantIf("perfect", round.correct===ROUND_LEN);
  grantIf("expertperfect", round.correct===ROUND_LEN && sel.level>=3);
  grantIf("pts100", p.points>=100);
  grantIf("pts500", p.points>=500);
  grantIf("pts1000", p.points>=1000);
  grantIf("allcats", p.cats.length>=20);
  save("gq_profiles",profiles);
  const pct=round.correct/ROUND_LEN;
  const [em,txt] = pct===1?["🏆","PERFECT! You're a geography superstar!"]
    : pct>=0.75?["🎉","Amazing job, explorer!"]
    : pct>=0.5?["😃","Great effort — keep exploring!"]
    : ["🌱","Good try! Every explorer starts somewhere!"];
  if(pct>=0.75) confetti();
  app.innerHTML = `
  <h1>Round Complete!</h1>
  <div class="result-emoji">${em}</div>
  <div class="card" style="text-align:center">
    <div class="bigscore">+${round.gained} points</div>
    <p style="margin:8px 0 4px;font-weight:700">${round.correct} / ${ROUND_LEN} correct</p>
    <p style="opacity:.85">${txt}</p>
  </div>
  ${round.newBadges.map(id=>{const b=BADGES.find(x=>x.id===id);return `<div class="newbadge">${b.i} New badge: <b>${b.n}</b>!</div>`;}).join("")}
  <button class="btn primary center" onclick="startRound(sel.cat)">Play Again 🔁</button>
  <button class="btn center" onclick="screenHome()">Choose Another Topic 🌍</button>
  <button class="btn ghost center" onclick="screenBadges()">See My Badges 🏅</button>`;
}

/* expose for inline handlers */
window.pickProfile=pickProfile; window.screenNewProfile=screenNewProfile; window.screenProfiles=screenProfiles;
window.setLevel=setLevel; window.startRound=startRound; window.screenHome=screenHome;
window.screenBadges=screenBadges; window.toggleSound=toggleSound; window.next=next; window.sel=sel;

/* start */
if(profiles.length===0) screenNewProfile(); else screenProfiles();
</script>
